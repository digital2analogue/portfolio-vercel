# Regenerates the visual regression baselines ON the CI runner and commits
# them. Run it from the Actions tab (or API) after intentional visual
# changes — baselines must be generated on the same environment that CI
# compares on, or font rasterization drift causes false failures.
name: Update visual baselines

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      # Deliberately still on v4 while ci.yml and tokens-freshness.yml moved to
      # v7. This is the ONE workflow that commits and pushes back, which depends
      # on checkout persisting credentials — and that path had no verified run
      # at v7 anywhere in this org: river-intro and decisioning-table run
      # checkout@v7 here, but every successful run of theirs took the "Baselines
      # unchanged" early exit (the commit step measures 0s in all of them), so
      # not one ever reached the push. This repo has 26 runs on v4 that
      # genuinely committed, which is why it stayed the known-good control.
      #
      # The push-credential probe in the commit step below now closes that gap:
      # every dispatch exercises auth whether or not baselines changed. So this
      # bump is no longer blind — it is sequenced. This repo (v4) runs the probe
      # first to prove the probe itself is sound; the v7 repos run it next, and
      # only a green result there justifies moving this file to v7. Until that
      # sequence has actually run, v4 stays.
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # Runs EARLY, while the checkout is still fresh. Without it, a run whose
      # baselines happen to be unchanged exits green having exercised nothing —
      # so a checkout version that stopped persisting credentials would stay
      # invisible until the next real regen, i.e. mid visual change, which is
      # the worst moment to find out. Every "successful" run of this workflow on
      # checkout@v7 across these repos took that early exit (the commit step
      # measures 0s in all of them), which is why v7 stayed unproven despite a
      # green history.
      #
      # --dry-run does the full auth and ref negotiation against origin and
      # writes nothing. It needs *push* permission, so unlike `git ls-remote` it
      # cannot pass on a public repo without credentials.
      #
      # Deliberately before the ~1min regenerate step rather than beside the
      # commit: run late, a branch that moved underneath us would fail this as
      # non-fast-forward and read as broken credentials. The real push keeps its
      # own rebase-and-retry loop for that case.
      - name: Verify push credentials
        run: |
          echo "Dry-run push (writes nothing) to prove credentials survived checkout…"
          git push --dry-run origin "HEAD:$GITHUB_REF_NAME"

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Regenerate baselines
        run: npm run test:visual:update

      - name: Commit refreshed baselines
        run: |
          if [ -z "$(git status --porcelain -- tests/visual/__screenshots__)" ]; then
            echo "Baselines unchanged — nothing to commit (push path already verified)."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/visual/__screenshots__
          git commit -m "chore: regenerate visual baselines on CI runner"
          # The branch can move while baselines regenerate (a session pushing
          # follow-up commits) — a rejected non-fast-forward push then fails
          # the whole run (observed in decisioning-table, 2026-07-02).
          # Rebase our baseline commit on top (favouring the fresh
          # screenshots) and retry.
          for i in 1 2 3; do
            git push && exit 0
            git pull --rebase -X theirs origin "$GITHUB_REF_NAME"
          done
          exit 1
