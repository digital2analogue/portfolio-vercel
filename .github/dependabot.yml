version: 2
updates:
  # Weekly npm bumps, grouped into a single PR to keep the noise down.
  # Security advisories still arrive as separate, immediate PRs.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      npm-dependencies:
        patterns:
          - "*"
        # Majors stay OUT of the group. Repo policy is that major bumps are
        # taken by hand, and with `patterns: ["*"]` alone that policy freezes
        # everything behind the first unapproved one — the group is a single
        # PR, so it merges whole or not at all. That is exactly what #40 was:
        # typescript 7 and eslint 10 rode in alongside a batch of safe bumps
        # and the whole thing had to be unpicked by hand into #41.
        #
        # The `ignore` list below and this are complementary, not redundant:
        # `ignore` suppresses the two majors already known to be unusable, and
        # this stops any *future* unknown major taking the safe half hostage
        # the same way. Minors and patches still arrive as one quiet weekly PR
        # that auto-merges; each major arrives on its own, declinable alone.
        #
        # river-intro shipped a WCAG token fix two weeks late learning this
        # (its #26/#27); decisioning-table has run this shape since its own
        # typescript-7 incident.
        update-types:
          - minor
          - patch
        # ...with one exception, because "one major per PR" is wrong for
        # packages that only work in lockstep. `@vitest/ui` declares an EXACT
        # peer on its matching `vitest`, so splitting the pair across two PRs
        # makes each one uninstallable: `npm install` fails ERESOLVE before a
        # build ever starts. That is what #88 and #89 were — the 4.1.11 -> 5.0.0
        # bump arriving as two halves, each conflicting with the half still on
        # main. Excluded here and regrouped below.
        exclude-patterns:
          - "vitest"
          - "@vitest/*"
      # The vitest family, kept whole. No `update-types` filter, so majors ride
      # in this group too and the pair moves together in one installable PR.
      # Majors are still taken by hand — this only ensures the PR offering them
      # can actually resolve, so CI can report on vitest 5 instead of dying at
      # install.
      vitest:
        patterns:
          - "vitest"
          - "@vitest/*"
    ignore:
      # TypeScript 7 (the Go-based compiler) doesn't provide the compiler API
      # Next.js needs — its presence in the weekly group makes every preview
      # build fail at `next build`. Take TS majors manually once Next supports
      # them; minors/patches within 6.x still flow through the group.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # ESLint 10 drops context.getFilename(), which the eslint-plugin-react
      # bundled by eslint-config-next@16 still calls — the group builds on
      # Vercel but fails CI's lint job (diagnosed in #40/#41; this codifies
      # that fix). Take ESLint majors manually alongside an eslint-config-next
      # release that supports them.
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]

  # Keep the actions used in .github/workflows fresh too.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
