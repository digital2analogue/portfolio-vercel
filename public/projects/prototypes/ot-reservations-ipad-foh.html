ault);\n    border-radius: var(--radius-full);\n    background: var(--color-background-alt);\n    color: var(--color-foreground-default);\n  }\n  /* The glyph is a plus; a close is the same mark turned. */\n  .rdp[data-expanded=\"true\"] .rdp-close .rd-icon { transform: rotate(45deg); }\n  /* The shell is wider than the phone, and nothing else says so. */\n  .rdp[data-expanded=\"true\"] .rdp-pan {\n    position: fixed;\n    left: 50%;\n    bottom: max(14px, env(safe-area-inset-bottom));\n    transform: translateX(-50%);\n    z-index: 61;\n    display: block;\n    padding: 7px 14px;\n    border-radius: var(--radius-pill);\n    background: var(--color-background-alt);\n    border: 1px solid var(--color-border-alt);\n    color: var(--color-foreground-muted);\n    font: var(--font-label-small);\n    white-space: nowrap;\n  }\n  /* Taller here than at desktop: the phone has the height to spend, and a\n     460px shell left two thirds of the viewport empty. */\n  .rdp[data-expanded=\"true\"] .rdp-screen { height: min(660px, 82dvh); }\n  .rdp-screen { height: 460px; }\n}\n.rdp-pan { display: none; }\n\n/* ═══════════════════════════════════════════════════════════════════\n   Editorial variant (.rd--editorial)\n   ───────────────────────────────────────────────────────────────────\n   The same component and data with a different type and surface\n   treatment. Everything the variant changes lives here, so the two\n   cannot drift apart and a fix to the base is a fix to both.\n\n   The exploration is \"what if OTKit had more editorial craft\", not\n   \"what if this were Resy\" — so the action teal STAYS. Swapping the\n   accent would make it a pastiche of a competitor; keeping it makes it\n   range within the brand.\n\n   Three moves, all of which raise craft without spending density:\n     1. Real display/body contrast. The guest name was 18px semibold in\n        the same family as everything else — bigger, not different. As a\n        serif at 26px it stops being a label and becomes the subject.\n     2. Hairlines instead of fills. The stat discs, the avatar disc and\n        the chip fills were the most product-UI things on screen. Figures\n        sitting directly on white under a tracked label read as more\n        considered AND take less room.\n     3. Micro-labels pushed further — wider tracking, lighter weight.\n   Plus: the device bezel goes. A notch and side rails say \"mockup\";\n   a clean card says \"product\".\n   ═══════════════════════════════════════════════════════════════════ */\n.rd--editorial {\n  --rd-hairline: #e8e9ea;\n}\n/* Bezel → card. */\n.rd--editorial .rd-device {\n  padding: 0;\n  border-radius: 26px;\n  background: none;\n  box-shadow: 0 1px 2px rgba(20, 26, 38, 0.06), 0 24px 60px -20px rgba(20, 26, 38, 0.22);\n}\n.rd--editorial .rd-device::before,\n.rd--editorial .rd-device::after,\n.rd--editorial .rd-notch { display: none; }\n.rd--editorial .rd-screen { border-radius: 26px; }\n\n/* 1. The name is the subject of the page, so it gets the one display moment. */\n.rr-demo.rd--editorial .rd-guest {\n  font: 400 26px/30px var(--primitive-font-family-serif), Georgia, serif;\n  letter-spacing: -0.02em;\n}\n.rd--editorial .rd-row--guest { min-height: 76px; padding-top: 18px; padding-bottom: 14px; }\n\n/* 2. Fills out, hairlines in. */\n.rr-demo.rd--editorial .rd-stats { padding: 6px 20px 18px; gap: 12px; }\n.rd--editorial .rd-stat__value {\n  width: auto;\n  height: auto;\n  background: none;\n  font: 400 26px/30px var(--primitive-font-family-serif), Georgia, serif;\n}\n.rr-demo.rd--editorial .rd-stat { align-items: flex-start; text-align: left; }\n.rd--editorial .rd-tag { box-shadow: inset 0 0 0 1px var(--rd-hairline); }\n\n/* 3. Micro-labels: wider, lighter, quieter. SECTION labels only — the wide\n   tracking is a structural device. Applying it to the stat labels overflowed the\n   four-column grid (\"NO-SHOWS\" wrapped and pushed its sub-count onto a third\n   line), which is the reminder that a treatment belongs to a ROLE, not to\n   everything that happens to be small. */\n.rr-demo.rd--editorial .rd-seclabel {\n  font: 500 12px/12px var(--rd-font);\n  letter-spacing: 0.14em;\n  text-transform: uppercase;\n  color: var(--rd-glyph);\n}\n.rd--editorial .rd-stat__label {\n  font: var(--rd-body-sm);\n  letter-spacing: normal;\n  text-transform: none;\n  color: var(--otk-ink);\n}\n.rr-demo.rd--editorial .rd-seclabel { padding: 22px 20px 6px; }\n.rd--editorial .rd-stat__label { margin-top: 2px; }\n/* The category glyph STAYS in the editorial variant. It was dropped once, on the\n   argument that wide-tracked caps are structure enough — but the glyph is the\n   only channel shared with the tag chips above and the strip below, so removing\n   it left the editorial screen naming its categories in one place and drawing\n   them in another. It reads at the label's weight, not the strip's: 16px on the\n   glyph tone, with the gap tightened so it sits inside the label rather than\n   beside it. No opacity on it: --rd-glyph is already the lightest tone that\n   holds SC 1.4.11's 3:1, and fading it would put it under. */\n.rd--editorial .rd-seclabel { gap: 7px; }\n.rd--editorial .rd-seclabel .rd-icon { flex: none; }\n\n/* A little air, bought from chrome rather than from content. */\n.rd--editorial .rd-select--sticky .rd-select__item { padding: 16px 10px; }\n.rd--editorial .rd-actionbar { padding: 14px 20px 22px; }\n\n/* ═══════════════════════════════════════════════════════════════════\n   Editorial variant, tablet (.rdp--editorial)\n   ───────────────────────────────────────────────────────────────────\n   The tablet's deltas ON TOP of the shared .rd--editorial layer, which\n   this variant also carries — the serif display name, the wide-tracked\n   micro-labels, the hairline tag rings and the extra air on the note\n   strip are the same rules the phone's exploration uses, so the two\n   cannot drift into two different ideas of \"editorial\".\n\n   Four moves, and nothing else:\n     1. Chrome recedes — the iOS status row goes, the bezel quiets.\n     2. One display moment — the serif name is the only weight at the\n        top of the record, so the quick facts lose their boxes.\n     3. One micro-label device runs across BOTH panels — the service\n        lists' section titles take the same wide-tracked caps as the\n        record's note-section labels. That is the structural join.\n     4. The status control stops shouting.\n\n   What deliberately does NOT change: the accent (this is range within\n   OTKit, not a pastiche of a competitor), the service-list density\n   (Back of House earns its density), and the rail.\n   ═══════════════════════════════════════════════════════════════════ */\n/* 1. Chrome recedes. The exploration is about the surface, not about\n      establishing \"this is an iPad\" a second time. */\n.rdp--editorial .rdp-statusbar { display: none; }\n.rdp--editorial .rdp-device {\n  padding: 12px;\n  border-radius: 26px;\n  background: #1b1d20;\n  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.06), 0 18px 44px -20px rgba(10, 13, 10, 0.55);\n}\n.rdp--editorial .rdp-screen { border-radius: 16px; }\n\n/* 2. One display moment. The serif name comes from .rd--editorial; the facts\n      give up their boxes so nothing competes with it above the fold. */\n.rdp--editorial .rdp-fact {\n  box-shadow: none;\n  padding: 0;\n  min-height: 0;\n  color: var(--rd-muted);\n}\n.rdp--editorial .rdp-facts { gap: 18px; padding: 12px 20px 10px; }\n.rdp--editorial .rd-row--guest { min-height: 72px; }\n\n/* 3. One micro-label device, both panels. The service lists' titles were 14/700\n      sans — the same weight as a guest name — which made the panel read as a\n      stack of equal headings. Wide-tracked caps demote them to structure and\n      match the record's section labels exactly. */\n.rdp--editorial .rdp-listhead b {\n  font: 500 11px/11px var(--rd-font);\n  letter-spacing: 0.14em;\n  text-transform: uppercase;\n  color: var(--rdp-on-chrome-alt);\n}\n.rdp--editorial .rdp-listhead i { text-decoration: none; opacity: 0.75; }\n\n/* 4. The status stops shouting. On the shipped screen this is a saturated bar\n      at the top of the side panel, so the eye lands on it before the guest\n      whose record is open. Here it is a ruled row carrying a state mark: the\n      colour still identifies the state, it just no longer owns the composition.\n      The glyph keeps the state's own tone — every one of the eleven clears 3:1\n      on white — and the label stays ink, so the state is never colour alone. */\n.rdp--editorial .rdp-status {\n  background: none;\n  border-bottom: 1px solid var(--rd-hairline);\n  min-height: 52px;\n}\n.rdp--editorial .rdp-status__label {\n  font: 500 11px/11px var(--rd-font);\n  letter-spacing: 0.14em;\n  text-transform: uppercase;\n  color: var(--otk-ink);\n}\n.rdp--editorial .rdp-status__chev { color: var(--rd-glyph); }\n.rdp--editorial .rdp-status:focus-visible { box-shadow: inset 0 0 0 2px var(--otk-focus); }\n.rdp--editorial .rdp-act__body b { font: var(--rd-label-md); }\n\n/* ── Entrance ──\n   One orchestrated reveal on scroll-in: the zones arrive in reading order, so\n   the eye is walked down the screen's structure once. Not repeated on scroll. */\n@keyframes rd-zone-in {\n  from { opacity: 0; transform: translateY(10px); }\n  to { opacity: 1; transform: none; }\n}\n.rd-screen[data-entered=\"true\"] .rd-zone,\n.rdp-screen[data-entered=\"true\"] .rd-zone {\n  animation: rd-zone-in var(--rd-dur-emph) var(--rd-ease) backwards;\n  animation-delay: calc(var(--rd-i, 0) * 55ms);\n}\n.rd-screen[data-entered=\"false\"] .rd-zone,\n.rdp-screen[data-entered=\"false\"] .rd-zone { opacity: 0; }\n\n@media (max-width: 420px) {\n  .rd-screen { height: 640px; }\n  .rd-device::before, .rd-device::after { display: none; }\n}\n@media (prefers-reduced-motion: reduce) {\n  .rd-scroll { scroll-behavior: auto; }\n  .rd-chiprow,\n  .rd-titlebar,\n  .rd-switch__track,\n  .rd-switch__thumb,\n  .rd-iconbtn,\n  .rd-action,\n  .rd-row--action,\n  .rd-chip,\n  .rd-header,\n  .rd-actionbar {\n    transition: none;\n  }\n  /* Zones render finished — the reveal is ambient, so it is dropped entirely\n     rather than sped up. Same for the icon pop and the panel slide: the state\n     change still lands, it just doesn't travel to get there. */\n  .rd-screen[data-entered] .rd-zone,\n  .rd-screen[data-entered=\"false\"] .rd-zone,\n  .rdp-screen[data-entered] .rd-zone,\n  .rdp-screen[data-entered=\"false\"] .rd-zone {\n    animation: none;\n    opacity: 1;\n  }\n  .rd-select__item[data-active=\"true\"] .rd-icon,\n  .rd-visits[data-dir=\"1\"],\n  .rd-visits[data-dir=\"-1\"] {\n    animation: none;\n  }\n}\n\n/* ═══════════════════════════════════════════════════════════════════\n   Case-detail page (/work/[slug])\n   ═══════════════════════════════════════════════════════════════════ */\n.case-detail__back {\n  font: var(--font-code);\n  letter-spacing: var(--letter-spacing-all-caps);\n  text-transform: uppercase;\n  color: var(--color-foreground-muted);\n  text-decoration: none;\n  display: inline-block;\n  margin-bottom: var(--primitive-space-2xl);\n  transition: color var(--motion-duration-instant) var(--motion-easing-default);\n}\n.case-detail__back:hover,\n.case-detail__back:focus-visible {\n  color: var(--color-foreground-action);\n  text-shadow: var(--phosphor-bloom-sm);\n}\n.case-detail__back:active {\n  text-shadow: var(--phosphor-bloom-md);\n}\n.case-detail__meta-row {\n  display: flex;\n  gap: var(--spacing-inline);\n  align-items: baseline;\n  margin-bottom: var(--spacing-tight);\n}\n.case-detail__index {\n  font: var(--font-code);\n  color: var(--color-foreground-action);\n  letter-spacing: var(--letter-spacing-body);\n  text-shadow: var(--phosphor-bloom-sm);\n}\n.case-detail__company-year {\n  font: var(--font-code);\n  color: var(--color-foreground-muted);\n  letter-spacing: var(--letter-spacing-all-caps);\n  text-transform: uppercase;\n}\n.case-detail__tags {\n  display: flex;\n  flex-wrap: wrap;\n  gap: var(--primitive-space-xs);\n  margin: var(--spacing-component) 0 var(--spacing-component);\n}\n.case-detail__hero-meta {\n  border-top: 1px solid var(--color-border-alt);\n  border-bottom: 1px solid var(--color-border-alt);\n  padding: var(--spacing-element) 0;\n  margin-bottom: var(--primitive-space-xs);\n}\n.case-detail__pager {\n  margin-top: var(--primitive-space-3xl);\n  padding-top: var(--spacing-component);\n  border-top: 1px solid var(--color-border-alt);\n  display: grid;\n  grid-template-columns: 1fr 1fr;\n  gap: var(--spacing-element);\n}\n/* Pager 1fr cells need min-width: 0 so long italic titles don't push the\n   column wider than its share of the row and overflow on mobile. */\n.case-detail__pager > div {\n  min-width: 0;\n}\n.case-detail__pager-link {\n  text-decoration: none;\n  display: block;\n  transition: padding var(--motion-duration-standard) var(--motion-easing-default);\n}\n.case-detail__pager-link:hover,\n.case-detail__pager-link:focus-visible {\n  padding: 0 var(--primitive-space-xs);\n}\n.case-detail__pager-label {\n  font: var(--font-code);\n  letter-spacing: var(--letter-spacing-all-caps);\n  text-transform: uppercase;\n  color: var(--color-foreground-muted);\n  margin-bottom: var(--primitive-space-2xs);\n  transition: color var(--motion-duration-instant) var(--motion-easing-default);\n}\n.case-detail__pager-link:hover .case-detail__pager-label,\n.case-detail__pager-link:focus-visible .case-detail__pager-label {\n  color: var(--color-foreground-action);\n  text-shadow: var(--phosphor-bloom-sm);\n}\n.case-detail__pager-title {\n  font: var(--font-title-medium);\n  letter-spacing: var(--letter-spacing-title);\n  color: var(--color-foreground-default);\n}\n/* Terminal-echo path line — mirrors the hero's `$ cat ./work/[slug].md` motif. */\n.case-detail__pager-path {\n  font: var(--font-code);\n  color: var(--color-foreground-muted);\n  letter-spacing: var(--letter-spacing-body);\n  margin-top: var(--primitive-space-2xs);\n  transition: color var(--motion-duration-instant) var(--motion-easing-default);\n}\n.case-detail__pager-link:hover .case-detail__pager-path,\n.case-detail__pager-link:focus-visible .case-detail__pager-path {\n  color: var(--color-foreground-action);\n}\n.case-detail__pager-link:active .case-detail__pager-label {\n  text-shadow: var(--phosphor-bloom-md);\n}\n.case-detail__pager-next {\n  text-align: right;\n}\n\n/* ═══════════════════════════════════════════════════════════════════\n   /tokens — design-system showcase\n   ═══════════════════════════════════════════════════════════════════ */\n.tokens-group {\n  display: flex;\n  flex-direction: column;\n  gap: var(--spacing-layout);\n  margin-bottom: var(--primitive-space-3xl);\n}\n.tokens-group__tier {\n  display: flex;\n  flex-direction: column;\n  gap: var(--spacing-tight);\n}\n.tokens-group__label {\n  font: var(--font-code);\n  color: var(--color-foreground-muted);\n  letter-spacing: var(--letter-spacing-all-caps);\n  text-transform: uppercase;\n  margin-bottom: var(--primitive-space-xs);\n}\n.tokens-row {\n  display: grid;\n  grid-template-columns: 40px 1fr auto;\n  gap: var(--spacing-element);\n  align-items: center;\n  padding: var(--primitive-space-sm) 0;\n  border-bottom: 1px solid var(--color-border-muted);\n}\n.tokens-row__swatch {\n  width: 32px;\n  height: 32px;\n  border-radius: var(--radius-sm);\n  border: 1px solid var(--color-border-alt);\n}\n.tokens-row__body {\n  display: flex;\n  flex-direction: column;\n  gap: var(--primitive-space-3xs);\n  min-width: 0;\n}\n.tokens-row__token {\n  font: var(--font-code);\n  color: var(--color-foreground-default);\n  letter-spacing: var(--letter-spacing-body);\n  overflow-wrap: anywhere;\n}\n.tokens-row__role {\n  font: var(--font-body-small);\n  color: var(--color-foreground-muted);\n  line-height: 1.5;\n}\n.tokens-row__value {\n  font: var(--font-code);\n  color: var(--color-foreground-alt);\n  font-size: 13px;\n  white-space: nowrap;\n}\n\n\n/* ── Deck-local adjustments (Hinge Health deck) ──\n   Smaller side-panel labels to match the list/record density, and hairline\n   seams between the chrome (top bar, rail) and the body UI. */\n.rdp-side .rdp-status__label { font-size: 13px; line-height: 16px; }\n.rdp-side .rdp-act__body b { font-size: 13px; line-height: 16px; }\n.rdp-side .rdp-act__body i { font-size: 11px; line-height: 14px; }\n.rdp-side .rd-switch__label { font-size: 12px; line-height: 15px; }\n.rdp-side .rd-referral { font-size: 13px; line-height: 16px; }\n.rdp-side .rdp-order__items { font-size: 11px; line-height: 15px; }\n.rd-action--secondary { flex-direction: row; gap: 8px; }\n.rdp-body { border-top: 1px solid rgba(255, 255, 255, 0.16); }\n.rdp-rail { border-right: 1px solid rgba(255, 255, 255, 0.16); }\n\n\n/* Deck embed: the 380px iframe viewport trips the mobile query (screen 640px),\n   which reads squat. Force true iPhone proportion — 356w device ≈ 772h (393:852). */\n.rd-screen { height: 748px !important; }\n\n/* ── Hero-match pass: sizes tuned to the slide-1 comp at the 1224x848 screen ── */\n.rr-demo.rd .rdp-fact { font: var(--rd-label-md); }\n.rdp-fact--end { margin-left: auto; }\n.rr-demo.rd.rdp .rd-guest { font: 700 22px/28px var(--rd-font); letter-spacing: -0.015em; }\n.rr-demo.rd.rdp .rd-row--guest { min-height: 80px; }\n.rr-demo.rd.rdp .rd-row--guest .rd-avatar { width: 48px; height: 48px; font: 600 16px/16px var(--rd-font); }\n.rdp-guestbody { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 3px; }\n.rdp-guestbody .rd-guest { flex: none; }\n.rdp-guestsub { font: var(--rd-body-md); color: var(--rd-muted); }\n.rr-demo.rd .rdp-act { min-height: 54px; }\n.rr-demo.rd .rdp-status { min-height: 52px; }\n.rr-demo.rd .rdp-state { min-height: 52px; }\n.rr-demo.rd .rdp-main > .rd-row { min-height: 52px; }\n.rr-demo.rd .rdp-facts { padding: 12px 16px; }\n\n/* ── Key Screens v1.1.1 parity — reservation list tiles (Frame 2608925) ──\n   Rows are raised TILES on the panel (#2d333f on #141a26, 1px seams), not\n   hairline-separated transparent rows. Name 20/24 semibold −0.32px in the comp\n   at 331px — 17/22 at our 280px panel keeps the same optical weight. Time is\n   full white in the comp, not muted. Icon marks are 24px there → 20px here. */\n.rdp-resv {\n  min-height: 60px;\n  border-top: 1px solid var(--rdp-chrome);\n  background: var(--rdp-chrome-alt);\n  padding: 6px 6px 6px 0;\n}\n.rdp-lists > section .rdp-resv:first-of-type { border-top: 0; }\n.rdp-resv:not([data-selected=\"true\"]):hover { background: #394252; }\n.rdp-resv__name { font: 600 17px/22px var(--rd-font); letter-spacing: -0.32px; }\n.rdp-resv__time { font: 400 14px/20px var(--rd-font); color: var(--rdp-on-chrome); }\n.rdp-resv__size { font: 400 15px/20px var(--rd-font); }\n.rdp-marks { max-width: 92px; gap: 2px; padding-top: 3px; }\n.rdp-marks > span { width: 21px; height: 21px; }\n.rdp-marks > span > svg { width: 20px; height: 20px; }\n/* Attention bar hugs the tile's left edge, full tile height, as in the comp. */\n.rdp-state { min-height: 48px; }\n.rdp-state[data-tone] { border-radius: 0 var(--otk-radius) var(--otk-radius) 0; }\n/* Accordion heads read as part of the dark panel, tiles as content. */\n.rdp-listhead { border-top: 0; padding-top: 10px; padding-bottom: 10px; }\n\n.rdp-listhead b { font: 700 16px/20px var(--rd-font); }\n.rdp-listhead i { font: 400 13px/16px var(--rd-font); }\n\n/* Key Screens parity, pass 2: size/VIP column and accordion-header tiles */\n.rdp-resv__size { display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 24px; }\n.rdp-resv__vip { display: inline-flex; }\n.rdp-resv__vip[data-tone=\"yellow\"] { color: #fdaf08; }\n.rdp-resv__vip svg { width: 18px; height: 18px; }\n/* Selected surface matches the comp's light gray. White text keeps 3.4:1;\n   secondary content inherits full white for legibility on the lighter step. */\n.rdp { --rdp-selected: #6b7080; }\n/* Accordion headers are tiles too, like iOS-accordion-reservation-list. */\n.rdp-listhead { background: var(--rdp-chrome-alt); min-height: 48px; margin-bottom: 1px; border-top: 1px solid var(--rdp-chrome); }\n.rdp-lists > section:first-child .rdp-listhead { border-top: 0; }\n.rdp-quotes { padding-top: 8px; }\n\n/* Key Screens parity, pass 3: two icon rows per tile — toned marks on the time\n   line, white-only marks beside the guest name; all marks 16px per the comp. */\n.rdp-resv__body { display: flex; flex-direction: column; gap: 2px; }\n.rdp-resv__line { display: flex; align-items: center; justify-content: space-between; gap: 6px; min-width: 0; }\n.rdp-resv__line .rdp-marks { flex: none; align-self: auto; flex-wrap: nowrap; max-width: none; padding-top: 0; gap: 3px; }\n.rdp-marks > span { width: 16px; height: 16px; }\n.rdp-marks > span > svg { width: 16px; height: 16px; }\n.rdp-marks--plain, .rdp-marks--plain > span { color: var(--rdp-on-chrome); }\n.rdp-resv__vip svg { width: 16px; height: 16px; }\n\n/* Key Screens parity, pass 4: right rail. Booked + the four actions are\n   discrete OUTLINED buttons in a padded stack (12px gutter, 10px gaps, 4px\n   radius, hairline ring), per the comp; the sections below (Not paid, the\n   Experiences order, pacing, referral) stay full-width flush rows. */\n.rdp-side__top { display: flex; flex-direction: column; gap: 10px; padding: 12px 12px 14px; border-bottom: 1px solid var(--rd-hairline); }\n.rdp .rdp-status { border-radius: var(--otk-radius); min-height: 48px; }\n.rdp-act--btn { border: 0; border-radius: var(--otk-radius); box-shadow: inset 0 0 0 1px var(--rd-edge); min-height: 48px; border-bottom: 0; }\n.rdp-actbtns { display: flex; flex-direction: column; gap: 10px; }\n.rdp-actions { display: flex; flex-direction: column; }\n\n/* Key Screens parity, pass 5: the facts row fills the record's full width —\n   three equal chips + a square trailing button, per the comp. */\n.rr-demo.rd .rdp-facts { padding: 12px 16px; gap: 12px; }\n.rr-demo.rd .rdp-fact { flex: 1 1 0; justify-content: center; min-height: 48px; }\n.rr-demo.rd .rdp-fact--end { flex: 0 0 48px; margin-left: 0; padding: 0; }\n\n/* Key Screens parity, pass 6: the attention marker is an inset rounded pill\n   (4px off the tile's edges, 6px radius), never flush with the tile edge. */\n.rdp-resv { padding-left: 4px; }\n.rdp-state { width: 24px; min-height: 0; align-self: stretch; margin: 4px 0; }\n.rdp-state[data-tone] { border-radius: 4px; }\n\n/* Key Screens parity, pass 7: waitlist quote chips are 52x61 tiles filling the\n   panel width (6-up, 3px gaps), not small 44px chips. */\n.rdp-quotes { gap: 3px; padding: 2px 4px 10px 8px; }\n.rdp-quote { min-height: 58px; gap: 2px; border-radius: 4px; }\n.rdp-quote__unit { font: 600 14px/16px var(--rd-font); }\n.rdp-quote__n { font: 600 14px/16px var(--rd-font); }\n.rdp-quote--add svg { width: 24px; height: 24px; }\n\n/* Expanded sections point their caret up. */\n.rdp-act__chev--open { transform: rotate(-90deg); }\n\n/* Key Screens parity, pass 9: 4pt spacing normalization + working disclosures. */\n.rdp-side__top { padding: 12px 12px 16px; gap: 8px; }\n.rdp-actbtns { gap: 8px; }\n.rdp-quotes { gap: 4px; padding: 4px 4px 8px 8px; }\n.rdp-resv__size { gap: 4px; }\n.rdp-act__chev { transition: transform var(--rd-dur) var(--rd-ease); }\n.rdp-act[aria-expanded] { cursor: pointer; }\n\n/* Key Screens parity, pass 10: comp-exact selected surface and muted lead tag. */\n.rdp { --rdp-selected: #91949a; }\n.rdp-resv[data-selected=\"true\"] .rdp-resv__time { color: #ffffff; }\n.rd-tag--muted { color: var(--rd-muted); }\n.rd-tag--muted .rd-icon { opacity: 0.7; }\n\n/* Key Screens parity, pass 11: OTKit semantic tokens on the right rail. */\n/* border/default = ash-lighter #d8d9db; foreground/alt = ash-default #6f737b (light theme). */\n.rdp-act--btn { box-shadow: inset 0 0 0 1px #d8d9db; }\n.rr-demo.rd .rdp-fact { box-shadow: inset 0 0 0 1px #d8d9db; }\n.rdp-act > .rd-icon { color: #6f737b; }\n.rdp-act--danger > .rd-icon { color: inherit; }\n/* Key Screens parity, pass 12: tile attention-marker glyphs at 24px, per comp. */\n.rdp-state svg { width: 24px; height: 24px; }\n/* Key Screens parity, pass 13: switch + referral rows share the .rdp-act inset (12px sides, 10px gap) so the rail reads as one component. */\n.rdp-actions > .rd-row { padding-left: 12px; padding-right: 12px; gap: 10px; }\n/* Key Screens parity, pass 14: every top-bar control shares one 44px height. */\n.rdp-topbar .rdp-chip, .rdp-topbar .rdp-icon { min-height: 44px; height: 44px; }\n/* Key Screens parity, pass 15: rail buttons at 44px tap size with comp spacing;\n   selected reservation tiles carry no accent edge. */\n.rdp-rail { width: 55px; gap: 14px; padding: 12px 0 12px; }\n.rdp-railbtn { width: 44px; height: 44px; }\n.rdp-resv.rdp-sel[data-selected=\"true\"]::after { display: none; }\n/* Key Screens parity, pass 17: guest-tile icons are 24×24 across the board;\n   on the selected tile every icon drops its tone and paints white\n   (foreground-default, dark mode). */\n.rdp-resv .rdp-marks > span, .rdp-resv .rdp-marks > span > svg { width: 24px; height: 24px; }\n.rdp-resv .rdp-resv__vip svg { width: 24px; height: 24px; }\n.rdp-resv[data-selected=\"true\"] .rdp-marks > span,\n.rdp-resv[data-selected=\"true\"] .rdp-resv__vip,\n.rdp-resv[data-selected=\"true\"] .rdp-resv__vip[data-tone=\"yellow\"],\n.rdp-resv[data-selected=\"true\"] .rdp-marks > span[data-tone] { color: #ffffff; }\n\n/* Key Screens parity, pass 16: outlined state buttons inherit the tile surface —\n   default, selected, whatever — only the hairline marks the control. */\n.rdp-statebtn[data-filled=\"false\"] { background: transparent; }\n\n\n\n\n.rdp-act__chev { color: #6f737b; }\n.rdp-status__chev { color: inherit; }\n\n/* Disclosure titles never draw their own divider; the section wrapper owns the hairline. */\n.rdp-order .rdp-act { border-bottom: 0; }\n\n\n/* Key Screens parity, pass 18: secondary-button + tab glyphs use\n   foreground/default #2d333f (not foreground/alt). Active tabs keep only the\n   border/action teal indicator — no teal glyph or label. */\n.rdp-act > .rd-icon:first-child, .rdp-act > .rd-icon { color: var(--otk-ink); }\n.rdp-act__chev { color: var(--otk-ink); }\n.rdp-act--danger, .rdp-act--danger > .rd-icon:first-child { color: #931b23; }\n.rdp-table .rd-icon { color: var(--otk-ink); }\n.rd-select__item[data-active=\"true\"] { color: var(--otk-ink); }\n\n\n/* Key Screens parity, pass 19: filled-notes dot under each tab glyph. */\n.rd-select__item { flex-direction: column; gap: 3px; }\n.rd-select__dot { width: 4px; height: 4px; border-radius: 50%; background: currentColor; }\n\n\n/* Key Screens parity, pass 20: the notes area matches the shipped card design —\n   each category is a white card on the inset gray canvas; the header row is the\n   latest note (or the add placeholder), the divider block carries attribution. */\n.rdp-notes .rd-scroll { background: #f1f2f4; padding: 12px; }\n.rdp-notes .rd-section--card { background: #ffffff; border: 1px solid var(--rd-hairline); border-radius: 8px; overflow: hidden; margin-bottom: 12px; }\n.rd-section--card .rd-seclabel { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }\n.rd-notehead { display: flex; align-items: flex-start; gap: 12px; width: 100%; padding: 14px 16px; background: none; border: 0; text-align: left; cursor: pointer; font: var(--rd-body-md); color: var(--otk-ink); }\n.rd-notehead:focus-visible { outline: none; box-shadow: inset 0 0 0 2px var(--otk-focus); }\n.rd-notehead__text { display: flex; flex-direction: column; gap: 2px; padding-top: 2px; }\n.rd-notehead__text b { font-weight: 400; }\n.rd-notehead__text--ph { color: var(--rd-muted); }\n.rd-nicon { flex: none; }\n.rd-nicon--blue { color: #4a6fde; }\n.rd-nicon--yellow { color: #fdaf08; }\n.rd-nicon--teal { color: #61bddb; }\n.rd-nicon--ink { color: var(--otk-ink); }\n.rd-notemeta { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; padding: 12px 16px 14px; border-top: 1px solid var(--rd-hairline); font: var(--rd-body-md); color: var(--rd-muted); }\n.rd-notemeta b { font-weight: 600; color: var(--otk-ink); }\n.rd-notetag { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; background: #f8f9fa; box-shadow: inset 0 0 0 1px var(--rd-hairline); font: var(--rd-label-sm); color: var(--otk-ink); }\n.rd-notetag svg { color: #61bddb; }\n.rdp-notes .rd-section--history { background: #ffffff; border: 1px solid var(--rd-hairline); border-radius: 8px; padding-bottom: 8px; }\n\n\n/* Key Screens parity, pass 21: tab glyphs and fact-row glyphs all use\n   foreground/default; only the border-action underline marks the active tab. */\n.rd-select__item { color: var(--otk-ink); }\n.rr-demo.rd .rdp-fact, .rr-demo.rd .rdp-fact svg { color: var(--otk-ink); }\n\n\n/* Key Screens parity, pass 22: guest sub-line carries leading glyphs. */\n.rdp-guestsub { display: inline-flex; align-items: center; gap: 6px; }\n.rdp-guestsub svg { color: var(--otk-ink); }\n.rdp-guestsub svg + span + svg, .rdp-guestsub span + svg { margin-left: 8px; }\n\n\n/* Key Screens parity, pass 23: Brandon Text (OTKit web family) for product UI.\n   The device status bar stays on the system stack (SF Pro on Apple hardware). */\n@font-face { font-family: \"Brandon Text\"; src: url(\"4c1d73f2-038b-4bef-bfcd-a18f752a225e\") format(\"opentype\"); font-weight: 400; font-display: swap; }\n@font-face { font-family: \"Brandon Text\"; src: url(\"7d6fc321-2dbb-4d62-814a-0554a1a42e7a\") format(\"opentype\"); font-weight: 500 600; font-display: swap; }\n@font-face { font-family: \"Brandon Text\"; src: url(\"e5b78331-c966-4ceb-a237-890058ea30d2\") format(\"opentype\"); font-weight: 700; font-display: swap; }\n.rr-demo.rd, .rr-demo.rd .rdp-screen { --rd-font: \"Brandon Text\", -apple-system, BlinkMacSystemFont, \"Segoe UI\", Roboto, \"Helvetica Neue\", Arial, sans-serif; }\n.rr-demo.rd { font-family: var(--rd-font); }\n.rd-status, .rdp-statusbar { font-family: -apple-system, BlinkMacSystemFont, \"Segoe UI\", Roboto, sans-serif; }\n\n/* Key Screens parity, pass 24: notes-card geometry per the full key screen —\n   flush square-edged white sections with the container shadow, 24px gray gaps,\n   flat canvas (no side inset), no hairline ring. */\n.rdp-notes .rd-scroll { padding: 8px 0 24px; }\n.rdp-notes .rd-section--card { border: 0; border-radius: 2px; margin-bottom: 24px; box-shadow: 0 2px 4px rgba(45, 51, 63, 0.2); }\n.rdp-notes .rd-section--card:last-of-type { margin-bottom: 24px; }\n.rd-notehead { padding: 16px; }\n.rd-notemeta { padding: 14px 16px 16px; gap: 8px; }\n.rdp-notes .rd-section--history { border: 0; border-radius: 2px; box-shadow: 0 2px 4px rgba(45, 51, 63, 0.2); }\n\n\n/* Key Screens parity, pass 25: tag/chip metrics — 32px tall, 16px glyphs, 14px labels. */\n.rd-tag { height: 32px; padding: 0 12px; font: 400 14px/20px var(--rd-font-ui); gap: 6px; }\n.rd-tag .rd-icon, .rd-tag svg { width: 16px; height: 16px; }\n.rd-notetag { height: 32px; padding: 0 12px; font: 400 14px/20px var(--rd-font-ui); }\n.rd-notetag svg { width: 16px; height: 16px; }\n\n/* Font correction: SF Pro Text (system stack) everywhere; Brandon Text ONLY on\n   the service-list section headers and the record's guest name — and always\n   semibold (Medium cut, 600 slot), never bold. */\n.rr-demo.rd, .rr-demo.rd .rdp-screen {\n  --rd-font: -apple-system, BlinkMacSystemFont, \"Segoe UI\", Roboto, \"Helvetica Neue\", Arial, sans-serif;\n  --rd-font-ui: var(--rd-font);\n  --rd-font-brand: \"Brandon Text\", -apple-system, BlinkMacSystemFont, sans-serif;\n}\n.rdp-listhead b { font: 600 16px/20px var(--rd-font-brand); }\n.rr-demo.rd.rdp .rd-guest { font: 600 22px/28px var(--rd-font-brand); letter-spacing: -0.015em; }\n.rr-demo.rd .rd-guest { font-family: var(--rd-font-brand); font-weight: 600; }\n\n\n/* Key Screens parity, pass 26 (inline comments): leading row glyphs in the\n   record are 24x24; star glyphs use OTKit foreground/accent-yellow #FDAF08. */\n.rdp-main .rd-row--action > svg, .rdp-main .rd-row--action > .rd-icon { width: 24px; height: 24px; }\n.rd-tag[data-tone=\"relationship\"] .rd-icon { color: #fdaf08; }\n\n\n/* Key Screens parity, pass 27 (drawing): the record column is a gray canvas\n   with 16px side gutters; each section is a white card with a very light\n   drop shadow, per the key screen. */\n.rdp-main { background: #f1f2f4; padding: 8px 16px 0; }\n.rr-demo.rd .rdp-facts { padding: 12px 0; }\n.rdp-main > .rd-zone { background: #ffffff; border-radius: 2px; box-shadow: 0 1px 3px rgba(45, 51, 63, 0.14); margin-bottom: 12px; }\n.rdp-main > .rd-zone.rd-strip, .rdp-main > .rd-strip { box-shadow: 0 1px 3px rgba(45, 51, 63, 0.14); background: #ffffff; }\n.rdp-notes .rd-section--card, .rdp-notes .rd-section--history { box-shadow: 0 1px 3px rgba(45, 51, 63, 0.14); }\n\n\n/* Inline comment: pacing-limit switch label — 14px semibold. */\n.rdp-side .rd-switch__label { font: var(--rd-body-md-semi); }\n\n\n/* Inline comment: rail label type — status + action labels at Label/Medium 14px,\n   action subtext at Label/Small 12px. */\n.rdp-side .rdp-status__label { font: var(--rd-label-md); }\n.rdp-side .rdp-act__body b { font: var(--rd-label-md); }\n.rdp-side .rdp-act__body i { font: var(--rd-label-sm); font-style: normal; font-weight: 400; }\n\n\n/* Inline comment: the dock tile is chrome-alt, so the dot's cutout ring must match it. */\n.rdp-dockbtn .rdp-newdot { box-shadow: 0 0 0 2px var(--rdp-chrome-alt); }\n\n\n/* Inline comments: side-rail plus at 24px; teal notification dot on Message guest. */\n.rdp-side .rd-row--action > svg, .rdp-side .rd-row--action > .rd-icon { width: 24px; height: 24px; }\n.rdp-act__icwrap { position: relative; display: inline-flex; flex-shrink: 0; }\n.rdp-act__icwrap > .rd-icon { width: 24px; height: 24px; }\n.rdp-act__dot {\n  position: absolute; top: -2px; right: -2px;\n  width: 8px; height: 8px; border-radius: 9999px;\n  background: #247f9e; box-shadow: 0 0 0 2px #fff;\n}\n\n\n/* Comp parity (iPad Pro source of truth): the notes zone is not itself a white\n   card — it is the gray canvas its category cards sit on. 12px gaps, same as\n   the sections above; each card white with the light container shadow. */\n.rdp-main > .rdp-notes.rd-zone { background: transparent; box-shadow: none; }\n.rdp-notes .rd-scroll { background: transparent; padding: 0 0 24px; }\n.rdp-notes .rd-section--card,\n.rdp-notes .rd-section--history {\n  background: #ffffff;\n  border: 0; border-radius: 2px;\n  margin-bottom: 12px;\n  box-shadow: 0 1px 3px rgba(45, 51, 63, 0.14);\n}\n.rdp-notes .rd-section--card:last-of-type { margin-bottom: 12px; }\n.rd-notehead { padding: 16px; }\n.rd-notemeta { padding: 12px 16px 16px; gap: 8px; }\n\n\n/* Inline comment: the fact chips keep a 16px inset from their card's edges. */\n.rr-demo.rd .rdp-facts { padding: 12px 16px; }\n\n\n/* Inline comment: guest-card pencil optically right-aligns with the tags card's edit glyph (16px glyph inset). */\n.rr-demo.rd .rd-row--guest .rd-iconbtn { margin-right: -18px; }\n\n\n/* Inline comment: section-header count glyphs are 24x24, counts label-large 16. */\n.rr-demo.rd .rdp-counts { font: 500 16px/16px var(--rd-font-brand, var(--rd-font)); }\n.rr-demo.rd .rdp-counts .rd-icon, .rr-demo.rd .rdp-counts svg { width: 24px; height: 24px; }\n\n\n/* Inline comment: middle-column cards are radius 4. */\n.rr-demo.rd .rdp-main > .rd-zone, .rr-demo.rd .rdp-main > .rd-strip { border-radius: 4px; }\n\n\n.rr-demo.rd .rdp-notes .rd-section--card, .rr-demo.rd .rdp-notes .rd-section--history { border-radius: 4px; }\n\n\n/* Inline comment: datebar step arrows are 24x24. */\n.rr-demo.rd .rdp-chip--step svg { width: 24px; height: 24px; }\n\n\n/* Inline comment: listhead sort link is 12px label-small. */\n.rr-demo.rd .rdp-listhead i { font: 400 12px/16px var(--rd-font-brand, var(--rd-font)); }\n\n\n/* ── Elevation pass (items 6–9) ──────────────────────────────\n   6. Type tightened to three stops: 22/600 guest name, 16/600 section\n      labels, 14/400 body — 12px label-small for metadata. Strays at\n      11/13/15/17px pulled onto the scale. */\n.rdp-side .rdp-status__label { font-size: 14px; line-height: 18px; }\n.rdp-side .rdp-act__body b { font-size: 14px; line-height: 18px; }\n.rdp-side .rdp-act__body i { font-size: 12px; line-height: 16px; }\n.rdp-side .rd-referral { font-size: 14px; line-height: 18px; }\n.rdp-side .rdp-order__items { font-size: 12px; line-height: 16px; }\n.rdp-resv__name { font-size: 16px; line-height: 22px; }\n.rdp-resv__size { font-size: 14px; }\n.rr-demo.rd .rdp-listhead i { font-size: 12px; line-height: 16px; }\n\n/* 7. Tabular numerals everywhere digits align vertically. */\n.rdp-counts, .rdp-fact, .rdp-resv__time, .rdp-resv__size, .rdp-badge,\n.rdp-table, .rdp-quote, .rdp-act__body, .rd-noteby, .rdp-listhead i,\n.rdp-live { font-variant-numeric: tabular-nums; }\n\n/* 8. One shadow token: OTKit --shadow-container on every elevated card. */\n.rdp-main > .rd-zone,\n.rdp-main > .rd-zone.rd-strip, .rdp-main > .rd-strip,\n.rdp-notes .rd-section--card, .rdp-notes .rd-section--history {\n  box-shadow: 0 2px 4px rgba(45, 51, 63, 0.2);\n  border: 0;\n}\n\n/* 9. Right rail reads as one continuous sheet: the rail itself carries the\n      surface + shadow; actions become full-width hairline-separated rows. */\n.rr-demo.rd .rdp-side { background: #ffffff; border-radius: 4px; box-shadow: 0 2px 4px rgba(45, 51, 63, 0.2); }\n.rr-demo.rd .rdp-actbtns { gap: 0; }\n.rr-demo.rd .rdp-act--btn { box-shadow: none; border-radius: 0; border-bottom: 1px solid var(--rd-hairline); }\n.rr-demo.rd .rdp-actbtns .rdp-act--btn:last-child { border-bottom: 0; }\n\n\n/* Elevation 7 fix: font: shorthand resets font-variant; re-assert at higher specificity. */\n.rr-demo.rd .rdp-counts, .rr-demo.rd .rdp-fact, .rr-demo.rd .rdp-resv__time,\n.rr-demo.rd .rdp-resv__size, .rr-demo.rd .rdp-badge, .rr-demo.rd .rdp-table,\n.rr-demo.rd .rdp-quote, .rr-demo.rd .rdp-act__body, .rr-demo.rd .rd-noteby,\n.rr-demo.rd .rdp-listhead i, .rr-demo.rd .rdp-live { font-variant-numeric: tabular-nums; }\n\n\n/* Revert elevation item 9: rail action buttons read as buttons again. */\n.rr-demo.rd .rdp-side { background: none; border-radius: 0; box-shadow: none; }\n.rr-demo.rd .rdp-actbtns { gap: 10px; }\n.rr-demo.rd .rdp-act--btn { box-shadow: inset 0 0 0 1px #d8d9db; border-radius: var(--otk-radius); border-bottom: 0; }\n\n\n.rr-demo.rd .rdp-side { background: #fff; }\n\n<\u002Fstyle>\n<style>html,body{background:#0A0D0A;}body{display:flex;justify-content:center;align-items:flex-start;padding:12px;}#root{width:1240px;}<\u002Fstyle>\n<\u002Fhead>\n<body>\n<div id=\"root\"><\u002Fdiv>\n<script src=\"d0cb458c-1f44-440c-a427-ced4aa246de1\"><\u002Fscript>\n<script src=\"d3bbfd79-3e2f-488b-b236-b5f35a4ea992\"><\u002Fscript>\n<script src=\"f5df07c2-80b2-4773-a2b9-468ab2c4b62d\"><\u002Fscript>\n<script>RDApp.ipad(document.getElementById('root'));<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
