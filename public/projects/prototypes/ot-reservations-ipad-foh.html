document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

"<!DOCTYPE html>\n<html lang=\"en\"><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<meta name=\"color-scheme\" content=\"dark\">\n<title>OT Reservations — iPad Front of House (live)<\u002Ftitle>\n<style>\n:root{\n  --radius-pill: 999px; --color-background-action: #247f9e; --color-foreground-on-action: #ffffff;\n  --font-label-medium: 600 14px/1.3 -apple-system, sans-serif; --font-label-small: 600 12px/1.3 -apple-system, sans-serif;\n  --font-title-medium: 600 18px/1.3 -apple-system, sans-serif; --font-body-small: 400 13px/1.5 -apple-system, sans-serif;\n  --font-code: 500 13px/1.4 ui-monospace, monospace;\n  --color-border-default: #d8d9db; --color-border-alt: #c4c6ca; --color-border-muted: #e7e9ec;\n  --color-background-alt: #f1f2f4; --color-foreground-default: #2d333f; --color-foreground-alt: #4a4f59;\n  --color-foreground-muted: #6f737b; --color-foreground-action: #247f9e;\n  --primitive-font-family-serif: Georgia, serif;\n  --letter-spacing-all-caps: 0.08em; --letter-spacing-body: 0; --letter-spacing-title: -0.01em;\n  --primitive-space-3xs: 2px; --primitive-space-2xs: 4px; --primitive-space-xs: 8px;\n  --primitive-space-2xl: 48px; --primitive-space-3xl: 64px;\n  --spacing-inline: 8px; --spacing-tight: 4px; --spacing-component: 16px; --spacing-element: 12px; --spacing-layout: 32px;\n  --phosphor-bloom-sm: none; --phosphor-bloom-md: none;\n  --primitive-space-md: 16px; --primitive-space-sm: 8px; --primitive-space-lg: 24px;\n  --radius-full: 999px; --radius-sm: 6px; --radius-md: 10px;\n  --motion-duration-instant: 120ms; --motion-duration-standard: 200ms; --motion-duration-emphasized: 350ms;\n  --motion-easing-default: cubic-bezier(0.25, 0.1, 0.25, 1);\n  --shadow-overlay: 0 6px 20px rgba(20, 26, 38, 0.16);\n}\nhtml,body{margin:0;padding:0;background:transparent;}\n*, *::before, *::after { box-sizing: border-box; }\n/* ── OTKit light-mode component context ── */\n.rr-demo {\n  /* OTKit Foundation (Variables Library) — resolved light-mode values */\n  --otk-bg: #ffffff;\n  --otk-surface: #f1f2f4;\n  --otk-ink: #2d333f;\n  --otk-alt: #6f737b;\n  --otk-border: #d8d9db;\n  --otk-action: #247f9e;\n  --otk-focus: #247f9e;\n  --otk-radius: 4px;\n  --otk-dur: var(--motion-duration-instant, 120ms);\n  --otk-ease: var(--motion-easing-default, cubic-bezier(0.25, 0.1, 0.25, 1));\n  font-family: -apple-system, BlinkMacSystemFont, \"Segoe UI\", Roboto, \"Helvetica Neue\", Arial, sans-serif;\n  color: var(--otk-ink);\n  display: flex;\n  flex-direction: column;\n  gap: var(--primitive-space-md);\n}\n\n/* ── iOS reservation detail (components/demos/ReservationDetailDemo) ──\n   A device frame around the redesigned reservation-detail screen. Same OTKit\n   light palette as the other demos (--otk-*); the bezel is neutral hardware,\n   not OTKit.\n\n   Held constant across this surface so nothing reads as accidental:\n     · ONE motion language — --rd-ease everywhere, durations off the parsimony\n       motion tokens so `prefers-reduced-motion` zeroes them at the source.\n     · ONE control radius (--rd-r), plus the pill for switches and the bezel\n       radii, which are hardware, not UI.\n     · ONE shadow idea — elevation appears only when content is actually\n       scrolled beneath a fixed edge. The device drop shadow is separate: it is\n       the object, not the interface.\n     · 4pt spacing grid; type held to 11/12/13/15/17/20.\n\n   Contrast: muted text is --rd-muted #63666d, not --otk-alt #6f737b, because\n   rows tint on hover/press — #6f737b clears AA on white (4.76:1) but fails on\n   the tint (4.25:1). #63666d holds on white, hover and press alike. */\n.rd {\n  display: block;\n\n  /* ── OTKit token map ──\n     Values read from the OTKit Rest iOS library via the Figma MCP (file\n     fRZiDUihnfQ51VTdtU0C1V). Straight token uses resolve through --otk-* in the\n     shared demo palette above; the three derived values below are recorded with\n     the token they come from and the reason they could not be used as-is.\n\n       background/default   #FFFFFF   → --otk-bg\n       background/alt       #F1F2F4   → --otk-surface   (hover, tracks, circles)\n       foreground/default   #2D333F   → --otk-ink\n       foreground/alt       #6F737B   → --otk-alt\n       foreground/action    #247F9E   → --otk-action    (indicator, focus, switch-on)\n       border/default       #D8D9DB   → --otk-border    (hairlines, switch-off track)\n       border/action        #247F9E   → --otk-focus\n       foreground/accent-yellow #FDAF08 → tag glyph, darkened (see below)\n     TYPE — the full OTKit scale, from the typography file\n     (FafCOBM6da0G6VUXEpiyvJ, node 306:78). That file documents the scale in\n     Brandon Text for mobile WEB; the iOS library renders the same steps in\n     SF Pro, which is what the system font stack on .rr-demo resolves to here.\n     Sizes and leading are the system's; only the family differs by platform.\n\n       Title/Small/Bold      18 / 24  -> guest name, history stat figures\n       Body/Large/Bold       16 / 24  -> section heading, compact nav title\n       Body/Medium/Regular   14 / 20  -> note body, placeholders\n       Body/Medium/Semibold  14 / 20  -> switch + referral row labels\n       Body/Small/Regular    12 / 16  -> bylines, event times, stat sub-counts\n       Label/Medium/Semibold 14 / 14  -> chips, primary action, avatar initials\n       Label/Small/Semibold  12 / 12  -> segment, tag labels, stat labels\n\n     Every step above is on the scale — nothing sits at 11, 13, 15, 17 or 20px\n     any more, and Label styles carry single-line leading (lh == size) while\n     Body styles carry their own. Device chrome (status bar 13px) is hardware,\n     not OTKit.\n\n     DERIVED — each is an OTKit token that fails a WCAG AA criterion in the\n     context this screen actually renders it in. Recorded rather than hidden:\n     the same failures exist in the shipped product. */\n  --rd-ease: cubic-bezier(0.32, 0.72, 0, 1); /* iOS-family decelerate */\n  /* \"A selected thing is moving.\" Overshoots a few percent and settles — the\n     difference between moved and arrived. Was a literal in two rules. */\n  --rd-ease-spring: cubic-bezier(0.34, 1.32, 0.64, 1);\n  --rd-indicator-h: 2px;\n  --rd-dur-micro: var(--motion-duration-instant, 120ms);\n  --rd-dur: var(--motion-duration-standard, 200ms);\n  --rd-dur-emph: var(--motion-duration-emphasized, 350ms);\n\n  --rd-r: 8px;\n\n  /* Component type. One declaration per OTKit step, so a rule names the step it\n     wants instead of restating four properties — which is how eight rules ended\n     up inheriting line-height 1.6 (28.8/22.4/19.2px) instead of the scale's.\n     The family is carried in the shorthand because `font:` requires it. */\n  --rd-font: -apple-system, BlinkMacSystemFont, \"Segoe UI\", Roboto, \"Helvetica Neue\", Arial, sans-serif;\n  --rd-title-sm:     700 18px/24px var(--rd-font); /* Title/Small/Bold      */\n  --rd-body-lg-bold: 700 16px/24px var(--rd-font); /* Body/Large/Bold       */\n  --rd-body-md:      400 14px/20px var(--rd-font); /* Body/Medium/Regular   */\n  --rd-body-md-semi: 600 14px/20px var(--rd-font); /* Body/Medium/Semibold  */\n  --rd-body-md-bold: 700 14px/20px var(--rd-font); /* Body/Medium/Bold      */\n  --rd-body-sm:      400 12px/16px var(--rd-font); /* Body/Small/Regular    */\n  --rd-label-md:     600 14px/14px var(--rd-font); /* Label/Medium/Semibold */\n  --rd-label-sm:     600 12px/12px var(--rd-font); /* Label/Small/Semibold  */\n  --rd-label-xs:     600 11px/11px var(--rd-font); /* badge counts only     */\n\n  --rd-hairline: var(--otk-border);\n  --rd-hover: var(--otk-surface);\n\n  /* foreground/alt #6F737B darkened. Rows tint on hover/press, and the token is\n     only 4.25:1 on background/alt — it clears 1.4.3 on white and nowhere else. */\n  --rd-muted: #63666d;\n  /* foreground/disabled #91949A darkened. Leading glyphs must hold 1.4.11's 3:1\n     in every row state; the token manages 3.04 on white but 2.55 when pressed. */\n  --rd-glyph: #82868e;\n  /* border/default #D8D9DB darkened. As a hairline it is fine; as the ONLY edge\n     of a control it is 1.41:1 and fails 1.4.11 outright. */\n  --rd-edge: #82868e;\n  /* background/alt #F1F2F4 darkened one step for the pressed state. OTKit's own\n     pressed token is not in the set this file exposes. */\n  --rd-press: #e9ebee;\n  /* One elevation recipe, two directions. Every \"content passes under this\n     edge\" shadow on both shells uses it — the sticky note strip and the tablet's\n     dock had separately-invented values, which is how an interface ends up with\n     three shadow languages and no one able to say what any of them means. */\n  --rd-edge-down: 0 8px 18px -10px rgba(20, 26, 38, 0.34);\n  --rd-edge-up: 0 -8px 18px -10px rgba(0, 0, 0, 0.72);\n}\n\n/* The demo renders inside .blocks, whose case-body typography styles bare\n   h3/h4/p/ul (serif body, light titles, ::before bullets) — foreign to this\n   product surface. Every heading/paragraph/list below therefore carries a class\n   AND is selected at .rr-demo.rd level (0,3,0), which outranks `.blocks h3`\n   (0,1,1) without depending on source order. Deliberately no blanket\n   `.rd h3 {}` reset: a type-selector reset would outrank these same classes. */\n.rr-demo.rd .rd-reset {\n  font: inherit;\n  letter-spacing: normal;\n  color: inherit;\n  margin: 0;\n  padding: 0;\n  list-style: none;\n}\n.rr-demo.rd .rd-reset::before { content: none; }\n\n/* ── Hardware ──\n   Bezel and screen are separate boxes so the screen can clip its own content\n   while the side rails sit outside the frame. */\n.rd-device {\n  position: relative;\n  width: 100%;\n  max-width: 356px;\n  margin: 0 auto;\n  padding: 11px;\n  border-radius: 52px;\n  background: linear-gradient(163deg, #33373d 0%, #17191c 34%, #0d0e10 68%, #26292e 100%);\n  box-shadow:\n    inset 0 0 0 1px rgba(255, 255, 255, 0.09),\n    0 1px 2px rgba(10, 13, 10, 0.4),\n    0 24px 56px -12px rgba(10, 13, 10, 0.5);\n}\n/* Side rails — volume pair left, power right. Decorative, and the only reason\n   the bezel reads as an object rather than a rounded rectangle. */\n.rd-device::before,\n.rd-device::after {\n  content: \"\";\n  position: absolute;\n  width: 2px;\n  border-radius: 2px;\n  background: linear-gradient(180deg, #3a3e44, #212429);\n}\n/* Left rail: ringer switch + the two volume keys, drawn as gradient stops in a\n   single element. This was three box-shadow copies of one bar, whose offsets\n   overlapped into one continuous line down the side of the phone — stops cannot\n   overlap, so the gaps are guaranteed. */\n.rd-device::before {\n  left: -2px;\n  top: 104px;\n  height: 178px;\n  background: linear-gradient(\n    180deg,\n    #2c3036 0 26px,\n    transparent 26px 46px,\n    #2c3036 46px 102px,\n    transparent 102px 122px,\n    #2c3036 122px 178px\n  );\n}\n.rd-device::after { right: -2px; top: 152px; height: 76px; }\n\n.rd-screen {\n  position: relative;\n  display: flex;\n  flex-direction: column;\n  height: 712px;\n  border-radius: 42px;\n  background: var(--otk-bg);\n  overflow: hidden;\n}\n\n/* Block, not inline: an inline SVG sits on the text baseline and carries a\n   descender gap, which is why glyph rows drift a pixel or two off centre from\n   each other. flex: none stops a crowded row shrinking one glyph and not its\n   neighbour. */\n.rd-icon { display: block; flex: none; }\n.rd-sr {\n  position: absolute;\n  width: 1px;\n  height: 1px;\n  padding: 0;\n  margin: -1px;\n  overflow: hidden;\n  clip-path: inset(50%);\n  white-space: nowrap;\n  border: 0;\n}\n\n/* ── Status bar + notch ── */\n.rd-status {\n  position: relative;\n  z-index: 3;\n  flex: none;\n  display: flex;\n  align-items: center;\n  justify-content: space-between;\n  height: 44px;\n  padding: 0 24px 0 28px;\n  color: var(--otk-ink);\n  font-size: 13px;\n  font-weight: 600;\n  font-variant-numeric: tabular-nums;\n  letter-spacing: 0.01em;\n}\n.rd-notch {\n  position: absolute;\n  top: -1px;\n  left: 50%;\n  transform: translateX(-50%);\n  width: 132px;\n  height: 27px;\n  background: #0a0b0c;\n  border-radius: 0 0 18px 18px;\n}\n.rd-status__right { display: inline-flex; align-items: center; gap: 6px; }\n.rd-homebar {\n  flex: none;\n  width: 132px;\n  height: 5px;\n  /* Home-indicator zone. Together with the action bar's bottom padding this\n     leaves ~30px under the buttons — the iOS safe area, not a stray gap. */\n  margin: 10px auto 10px;\n  border-radius: var(--radius-full);\n  background: #1c1f24;\n  opacity: 0.32;\n}\n\n/* ── Header: chip row ⇄ compact title ── */\n.rd-header {\n  position: relative;\n  z-index: 2;\n  flex: none;\n  height: 52px;\n  background: var(--otk-bg);\n  /* Hairline at rest; it deepens into elevation once content passes under. */\n  box-shadow: 0 1px 0 var(--rd-hairline);\n  transition: box-shadow var(--rd-dur) var(--rd-ease);\n}\n.rd-header[data-scrolled=\"true\"] {\n  box-shadow: 0 1px 0 var(--rd-hairline), 0 6px 16px -8px rgba(20, 26, 38, 0.28);\n}\n.rd-chiprow,\n.rd-titlebar {\n  position: absolute;\n  inset: 0;\n  display: flex;\n  align-items: center;\n  transition:\n    opacity var(--rd-dur) var(--rd-ease),\n    transform var(--rd-dur) var(--rd-ease);\n}\n.rd-header[data-collapsed=\"false\"] .rd-titlebar,\n.rd-header[data-collapsed=\"true\"] .rd-chiprow {\n  opacity: 0;\n  pointer-events: none;\n}\n/* The two halves pass through each other rather than cross-fading in place —\n   the chips lift away as the title settles down into their space. */\n.rd-header[data-collapsed=\"false\"] .rd-titlebar { transform: translateY(6px); }\n.rd-header[data-collapsed=\"true\"] .rd-chiprow { transform: translateY(-6px); }\n\n.rd-chip {\n  flex: 1 1 auto;\n  display: inline-flex;\n  align-items: center;\n  justify-content: center;\n  gap: 8px;\n  height: 100%;\n  padding: 0 8px;\n  background: var(--otk-bg);\n  border: 0;\n  border-right: 1px solid var(--rd-hairline);\n  color: var(--otk-ink);\n  font: var(--rd-label-md);\n  font-variant-numeric: tabular-nums;\n  cursor: pointer;\n  transition: background-color var(--rd-dur) var(--rd-ease);\n}\n.rd-chip--icon { flex: 0 0 48px; }\n.rd-chip:last-child { border-right: 0; }\n\n/* Fast in, slow out — the press reads as immediate, the release as a settle.\n   Same asymmetry on every pressable surface below. */\n.rd-chip:active { background: var(--rd-press); transition-duration: 40ms; }\n.rd-chip:focus-visible {\n  outline: none;\n  box-shadow: inset 0 0 0 2px var(--otk-focus);\n}\n\n.rd-titlebar { justify-content: center; }\n.rd-titlebar__back {\n  position: absolute;\n  left: 0;\n  display: inline-flex;\n  align-items: center;\n  justify-content: center;\n  width: 48px;\n  height: 100%;\n  background: none;\n  border: 0;\n  color: var(--otk-ink);\n  cursor: pointer;\n  transition: background-color var(--rd-dur) var(--rd-ease);\n}\n.rd-titlebar__back:active { background: var(--rd-press); transition-duration: 40ms; }\n.rd-titlebar__back:focus-visible { outline: none; box-shadow: inset 0 0 0 2px var(--otk-focus); }\n.rd-titlebar__name {\n  font: var(--rd-body-lg-bold);\n  letter-spacing: -0.01em;\n  color: var(--otk-ink);\n}\n\n/* ── Scroll body ── */\n.rd-scroll {\n  /* Positioned so section offsetTop is measured from THIS box — the scroll spy\n     and the tab jumps both read offsetTop, and an unpositioned scroller would\n     hand them page-level coordinates and clamp every jump to max scroll. */\n  position: relative;\n  flex: 1 1 auto;\n  overflow-y: auto;\n  overscroll-behavior: contain;\n  background: var(--otk-bg);\n  scrollbar-width: none;\n}\n.rd-scroll::-webkit-scrollbar { display: none; }\n.rd-scroll:focus-visible { outline: 2px solid var(--otk-focus); outline-offset: -2px; }\n\n/* The repeating zone: one row = icon + label (+ trailing affordance). Every\n   pattern on this screen is a variation of it — that IS the modularity claim. */\n.rd-row {\n  display: flex;\n  align-items: center;\n  gap: 14px;\n  width: 100%;\n  min-height: 48px;\n  padding: 10px 20px;\n  background: var(--otk-bg);\n  border: 0;\n  border-bottom: 1px solid var(--rd-hairline);\n  color: var(--otk-ink);\n  font: inherit;\n  text-align: left;\n}\n.rd-row--action {\n  cursor: pointer;\n  transition: background-color var(--rd-dur-emph) var(--rd-ease);\n}\n\n.rd-row--action:active { background: var(--rd-press); transition-duration: 40ms; }\n.rd-row--action:focus-visible { outline: none; box-shadow: inset 0 0 0 2px var(--otk-focus); }\n/* Leading row glyphs recede — they orient, they don't inform; the label beside\n   each one carries the meaning. --rd-glyph is the LIGHTEST grey that still holds\n   SC 1.4.11's 3:1 non-text minimum in all three row states (3.65 white / 3.26\n   hover / 3.06 pressed), so it sinks toward the background without ever becoming\n   decoration. Trailing glyphs are actions, not orientation, and stay at ink.\n   Not in the contrast gate by design: that gate asserts a single 4.5:1 text\n   threshold and would reject a correctly-specified non-text mark. */\n.rd-row > .rd-icon:first-child,\n.rd-event > .rd-icon:first-child { color: var(--rd-glyph); }\n.rd-row .rd-icon { color: var(--otk-ink); }\n.rd-iconbtn .rd-icon { color: inherit; }\n.rd-iconbtn:active { color: var(--otk-ink); }\n.rd-placeholder { flex: 1 1 auto; font: var(--rd-body-md); color: var(--rd-muted); }\n\n/* ── Populated rows ──\n   The screen is a guest record, so most rows carry content; the \"Add a …\"\n   placeholder is the empty state, not the resting state. */\n/* Tag chips match OTKit's `iOS-tags` component (Rest iOS library, node\n   10085:29238) rather than being invented: an OUTLINED pill on white, not a\n   filled grey one. Values read from the component's own variables —\n   background/default #FFFFFF, border/default #D8D9DB (= --otk-border),\n   foreground/default #2D333F (= --otk-ink), radius full. Uses the component's\n   SMALL variant — Label/Small/Semibold at 12px — because these labels are real\n   category names (\"Shellfish allergy\") and at the 14px medium size four of them\n   stack one per line and swallow the screen. This row wants density, so the box\n   is tightened (26px tall, 8px sides, 6px gaps) and the row's own padding pulls\n   in with it. 12px is the floor and stays the floor: below it a category label\n   stops being readable at arm's length on a host stand. The component\n   also offers a leading star and a\n   trailing ×; both are omitted here — the × belongs to an edit mode this screen\n   isn't in, and the star's #FDAF08 on white is under 3:1, so it would need a\n   repair to carry meaning it isn't carrying. */\n.rd-tags { flex: 1 1 auto; display: flex; flex-wrap: wrap; gap: 6px; min-width: 0; }\n.rd-tag {\n  display: inline-flex;\n  align-items: center;\n  height: 26px;\n  padding: 0 8px;\n  border-radius: var(--radius-full);\n  background: var(--otk-bg);\n  /* Inset so the ring never adds to the chip's box — the component is spec'd at\n     exactly 32px tall, border included. */\n  box-shadow: inset 0 0 0 1px var(--otk-border);\n  gap: 4px;\n  color: var(--otk-ink);\n  font: var(--rd-label-sm);\n  white-space: nowrap;\n}\n/* Tones are keyed by CATEGORY, not by tag, so two tags in one category cannot\n   drift apart — VIP and Friend of owner are both relationship and therefore both\n   the gold star. Each clears 3:1 on white so the glyph is a UI mark rather than\n   decoration; OTKit's accent-yellow #FDAF08 is 1.86:1 and is darkened to #A97405\n   (4.05:1). General takes the neutral glyph tone: it is the absence of a special\n   category, so it should not compete with the ones that mean something. */\n.rd-tag .rd-icon { opacity: 0.95; }\n.rd-tag[data-tone=\"relationship\"] .rd-icon { color: #a97405; }\n.rd-tag[data-tone=\"food\"] .rd-icon { color: #cc3b48; }\n.rd-tag[data-tone=\"seating\"] .rd-icon { color: #4a6fde; }\n.rd-tag[data-tone=\"general\"] .rd-icon { color: var(--rd-glyph); }\n\n.rd-row--note {\n  align-items: flex-start;\n  min-height: 0;\n  padding: 6px 20px 12px;\n}\n.rd-note { flex: 1 1 auto; display: flex; flex-direction: column; gap: 2px; min-width: 0; }\n.rd-notetext { flex: 1 1 auto; font: var(--rd-body-md); color: var(--otk-ink); }\n.rd-noteby { font: var(--rd-body-sm); color: var(--rd-muted); }\n\n\n.rd-row--tags { gap: 12px; padding-left: 16px; padding-right: 16px; }\n.rd-row--guest { min-height: 64px; gap: 12px; }\n.rd-avatar {\n  flex: none;\n  display: inline-flex;\n  align-items: center;\n  justify-content: center;\n  width: 40px;\n  height: 40px;\n  border-radius: var(--radius-full);\n  background: var(--rd-hover);\n  color: var(--otk-ink);\n  font: var(--rd-label-md);\n  letter-spacing: 0.01em;\n}\n.rr-demo.rd .rd-guest {\n  flex: 1 1 auto;\n  margin: 0;\n  font: var(--rd-title-sm);\n  letter-spacing: -0.015em;\n  color: var(--otk-ink);\n}\n/* Trailing edit affordances are the quietest marks on the screen, by three\n   levers at once: --rd-glyph rather than ink, a thinner pencil silhouette, and\n   16px rather than 24. They sit beside the guest's name and their tags, and the\n   content should win every time.\n\n   That reclassifies them on the glyph scale — 24 is now PRIMARY affordances (nav\n   chips, note tabs, row leads, bottom actions) and 16 is SECONDARY and inline\n   (tags, metadata, trailing edits). Still a two-tier rule, just drawn in the\n   right place.\n\n   3.65:1 on white, 3.26 hovered, 3.06 pressed — the lightest grey that holds\n   SC 1.4.11 in every state a row reaches. Usability is untouched: the 44px hit\n   area comes from padding, not from the glyph, and pressing darkens to ink. */\n.rd-iconbtn {\n  flex: none;\n  color: var(--rd-glyph);\n  display: inline-flex;\n  /* 16px glyph + 14px each side = a 44px target. The negative margin gives the\n     hit area back to the row, so the target grows without the layout moving —\n     shrinking the glyph must not shrink the thing you tap. */\n  padding: 14px;\n  margin: -14px;\n  background: none;\n  border: 0;\n  border-radius: var(--rd-r);\n  cursor: pointer;\n  transition:\n    background-color var(--rd-dur-emph) var(--rd-ease),\n    transform var(--rd-dur-micro) var(--rd-ease);\n}\n\n.rd-iconbtn:active { background: var(--rd-press); transform: scale(0.92); transition-duration: 40ms; }\n.rd-iconbtn:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--otk-focus); }\n\n/* ── Selection strip ──\n   ONE control, used twice: the note strip (sticky, glyphs, scroll anchors) and\n   the visit scope (inline, words, panel swap). These were two blocks describing\n   the same pattern, which is how their active colours drifted apart and how the\n   scope indicator ended up hardcoding \"exactly two, equal width\" while the note\n   strip measured itself. Consistency that isn't shared implementation decays on\n   the first edit.\n\n   The rule for selection, stated once: the selected item takes\n   foreground/action — glyph and label alike — and carries a border/action\n   underline. Unselected is muted. Press tints only the UNSELECTED items:\n   pressing the current selection is a no-op, so there is nothing to acknowledge,\n   and it keeps the selected label off the press tint, where teal would fall to\n   4.07:1 and miss text AA. */\n.rd-select {\n  position: relative;\n  display: flex;\n  background: var(--otk-bg);\n  box-shadow: 0 1px 0 var(--rd-hairline);\n  transition: box-shadow var(--rd-dur) var(--rd-ease);\n}\n.rd-select--sticky {\n  position: sticky;\n  top: 0;\n  z-index: 2;\n}\n.rd-select--sticky[data-stuck=\"true\"] {\n  box-shadow: 0 1px 0 var(--rd-hairline), var(--rd-edge-down);\n}\n.rd-select__item {\n  position: relative;\n  flex: 1 1 0;\n  display: inline-flex;\n  align-items: center;\n  justify-content: center;\n  min-height: 36px;\n  padding: 12px 10px;\n  background: none;\n  border: 0;\n  color: var(--rd-muted);\n  font: var(--rd-label-sm);\n  cursor: pointer;\n  transition:\n    color var(--rd-dur) var(--rd-ease),\n    background-color var(--rd-dur-emph) var(--rd-ease);\n}\n.rd-select--sticky .rd-select__item { padding: 14px 10px; }\n.rd-select__item[data-active=\"true\"] { color: var(--otk-action); }\n.rd-select__item:not([data-active=\"true\"]):active {\n  background: var(--otk-surface);\n  transition-duration: 40ms;\n}\n.rd-select__item:focus-visible { outline: none; box-shadow: inset 0 0 0 2px var(--otk-focus); }\n\n/* The active glyph pops once as the indicator arrives under it, then settles\n   back to exactly 24px — it used to rest at scale(1.08), which rendered at ~26px\n   and off the 16/24 glyph scale. */\n.rd-select__item .rd-icon { transition: transform var(--rd-dur) var(--rd-ease); }\n@keyframes rd-icon-pop {\n  0% { transform: scale(1); }\n  55% { transform: scale(1.18); }\n  100% { transform: scale(1); }\n}\n.rd-select__item[data-active=\"true\"] .rd-icon {\n  animation: rd-icon-pop var(--rd-dur-emph) var(--rd-ease);\n}\n\n/* One indicator that travels, instead of N that blink on and off. Width is 1px\n   and scaled, so position and size both come from the measured active item —\n   which generalises to any count and to unequal widths. */\n.rd-select__indicator {\n  position: absolute;\n  bottom: 0;\n  left: 0;\n  width: 1px;\n  height: var(--rd-indicator-h);\n  transform-origin: left center;\n  background: var(--otk-action);\n  border-radius: var(--rd-indicator-h) var(--rd-indicator-h) 0 0;\n  transition: transform var(--rd-dur-emph) var(--rd-ease-spring);\n  will-change: transform;\n}\n.rd-select[data-ready=\"false\"] .rd-select__indicator { opacity: 0; }\n\n.rd-section { scroll-margin-top: 52px; }\n/* The last section still has to be able to scroll its top up to the strip, or\n   the History tab could never become active by scrolling. Sized to the SHORTER\n   scope (Current visit) with ~30px to spare — any more and the screen ends on a\n   slab of dead white at max scroll. */\n.rd-section--history { padding-bottom: 88px; }\n\n/* Every section opens with the same small label — glyph + category, once. It\n   replaces the glyph that used to repeat on every note row: the strip already\n   names the section, so restating it per row was redundant, cost ~34px of\n   horizontal on each note, and rendered one category two ways (coloured in a tag\n   chip, grey in a row). Stating it once also answers a question the old design\n   could not: which category am I reading, when scrolled into the middle of one. */\n.rr-demo.rd .rd-seclabel {\n  display: flex;\n  align-items: center;\n  gap: 8px;\n  margin: 0;\n  /* Tight to the notes it introduces, looser above — the gap belongs BETWEEN\n     sections, not between a label and the thing it labels. */\n  padding: 14px 20px 2px;\n  font: var(--rd-label-sm);\n  letter-spacing: 0.04em;\n  text-transform: uppercase;\n  color: var(--rd-muted);\n}\n.rd-seclabel .rd-icon { color: var(--rd-glyph); }\n\n/* ── History stats ── */\n.rr-demo.rd .rd-stats {\n  display: grid;\n  grid-template-columns: repeat(4, 1fr);\n  gap: 4px;\n  margin: 0;\n  padding: 2px 12px 14px;\n  list-style: none;\n}\n.rr-demo.rd .rd-stat {\n  display: flex;\n  flex-direction: column;\n  align-items: center;\n  gap: 6px;\n  text-align: center;\n}\n.rd-stat__value {\n  display: inline-flex;\n  align-items: center;\n  justify-content: center;\n  width: 44px;\n  height: 44px;\n  border-radius: var(--radius-full);\n  background: var(--rd-hover);\n  color: var(--otk-ink);\n  font: var(--rd-title-sm);\n  font-variant-numeric: tabular-nums;\n}\n.rd-stat__label { font: var(--rd-label-sm); color: var(--otk-ink); }\n.rd-stat__sub { font: var(--rd-body-sm); color: var(--rd-muted); font-variant-numeric: tabular-nums; }\n\n/* ── Visit log ── */\n/* Switching scope is a lateral move, so the panel says so: it enters from the\n   direction of travel instead of fading in place. Keyed on scope in the\n   component, which remounts the panel and replays this on every switch. */\n@keyframes rd-panel-fwd {\n  from { opacity: 0; transform: translateX(14px); }\n  to { opacity: 1; transform: none; }\n}\n@keyframes rd-panel-back {\n  from { opacity: 0; transform: translateX(-14px); }\n  to { opacity: 1; transform: none; }\n}\n.rd-visits { padding: 16px 20px; }\n.rd-visits[data-dir=\"1\"] { animation: rd-panel-fwd var(--rd-dur) var(--rd-ease); }\n.rd-visits[data-dir=\"-1\"] { animation: rd-panel-back var(--rd-dur) var(--rd-ease); }\n.rd-visits:focus { outline: none; }\n.rd-visit + .rd-visit { margin-top: 18px; }\n.rr-demo.rd .rd-visit__heading {\n  margin: 0 0 8px;\n  font: var(--rd-body-md-bold);\n  letter-spacing: -0.01em;\n  color: var(--otk-ink);\n}\n.rd-event { display: flex; align-items: flex-start; gap: 10px; }\n.rd-event .rd-icon { margin-top: 1px; color: var(--otk-ink); }\n.rd-event__time {\n  flex: none;\n  font: var(--rd-body-sm);\n  color: var(--rd-muted);\n  font-variant-numeric: tabular-nums;\n}\n.rd-event__body { flex: 1 1 auto; min-width: 0; }\n.rr-demo.rd .rd-event__text {\n  margin: 0;\n  font-size: 14px;\n  line-height: 20px;\n  color: var(--otk-ink);\n}\n.rr-demo.rd .rd-event__meta {\n  display: flex;\n  align-items: center;\n  gap: 6px;\n  margin: 3px 0 0;\n  font: var(--rd-body-sm);\n  color: var(--rd-muted);\n}\n.rd-event__table {\n  flex: none;\n  display: inline-flex;\n  align-items: center;\n  gap: 4px;\n  font: var(--rd-body-md);\n  color: var(--otk-ink);\n  font-variant-numeric: tabular-nums;\n}\n\n/* ── Pacing switch ── */\n.rd-row--switch { border-top: 1px solid var(--rd-hairline); }\n.rd-switch {\n  position: relative;\n  display: flex;\n  align-items: center;\n  justify-content: space-between;\n  gap: 16px;\n  width: 100%;\n  cursor: pointer;\n}\n.rd-switch__label { font: var(--rd-body-md-semi); color: var(--otk-ink); }\n.rd-switch input {\n  position: absolute;\n  width: 1px;\n  height: 1px;\n  opacity: 0;\n}\n.rd-switch__track {\n  flex: none;\n  display: inline-flex;\n  align-items: center;\n  width: 51px;\n  height: 31px;\n  padding: 2px;\n  border-radius: var(--radius-full);\n  background: var(--otk-border);\n  /* Off, the fill alone is 1.47:1 on the row — the switch would be invisible to\n     low vision until turned on. The ring gives it a 3.65:1 boundary; the on\n     state carries its own (teal fill, 4.56:1) and drops the ring. */\n  box-shadow: inset 0 0 0 1px var(--rd-edge);\n  transition:\n    background-color var(--rd-dur) var(--rd-ease),\n    box-shadow var(--rd-dur) var(--rd-ease);\n}\n.rd-switch__thumb {\n  width: 27px;\n  height: 27px;\n  border-radius: var(--radius-full);\n  background: var(--otk-bg);\n  box-shadow: 0 2px 4px rgba(20, 26, 38, 0.24), 0 0 0 0.5px rgba(20, 26, 38, 0.06);\n  transition: transform var(--rd-dur) var(--rd-ease);\n}\n.rd-switch input:checked ~ .rd-switch__track { background: var(--otk-action); box-shadow: none; }\n.rd-switch input:checked ~ .rd-switch__track .rd-switch__thumb { transform: translateX(20px); }\n.rd-switch input:focus-visible ~ .rd-switch__track {\n  box-shadow: 0 0 0 2px var(--otk-bg), 0 0 0 4px var(--otk-focus);\n}\n\n.rd-row--referral { border-bottom: 0; }\n.rd-referral { flex: 1 1 auto; font: var(--rd-body-md-semi); color: var(--otk-ink); }\n.rd-row--referral .rd-chevron { color: var(--rd-muted); }\n\n/* ── Bottom action bar ── */\n.rd-actionbar {\n  position: relative;\n  z-index: 2;\n  flex: none;\n  display: flex;\n  gap: 8px;\n  padding: 12px 20px 20px;\n  background: var(--otk-bg);\n  box-shadow: 0 -1px 0 var(--rd-hairline);\n  transition: box-shadow var(--rd-dur) var(--rd-ease);\n}\n/* Elevation only while there is still content to scroll past it. */\n.rd-actionbar[data-floating=\"true\"] {\n  box-shadow: 0 -1px 0 var(--rd-hairline), 0 -8px 18px -10px rgba(20, 26, 38, 0.3);\n}\n.rd-action {\n  display: inline-flex;\n  align-items: center;\n  justify-content: center;\n  gap: 2px;\n  height: 48px;\n  border: 0;\n  border-radius: var(--rd-r);\n  font: inherit;\n  font-size: 13px;\n  font-weight: 600;\n  cursor: pointer;\n  transition:\n    filter var(--rd-dur-emph) var(--rd-ease),\n    transform var(--rd-dur-micro) var(--rd-ease);\n}\n\n.rd-action:active { filter: brightness(0.9); transform: scale(0.985); transition-duration: 40ms; }\n.rd-action:focus-visible {\n  outline: none;\n  box-shadow: 0 0 0 2px var(--otk-bg), 0 0 0 4px var(--otk-focus);\n}\n.rd-action--primary { flex: 1 1 58%; gap: 8px; background: var(--otk-action); color: var(--otk-bg); }\n.rd-action__label { font: var(--rd-label-md); letter-spacing: -0.01em; }\n/* Source screen puts muted grey on this grey fill (~3:1); ink instead → 8.97:1. */\n/* Secondary is an OUTLINED button: background/default fill, so the edge is the\n   only thing that identifies it and has to carry SC 1.4.11 on its own. OTKit's\n   border/default #D8D9DB is 1.41:1 on white and cannot, so this uses --rd-edge\n   (3.65:1) — the same repair the switch and segment make. The tag chips keep the\n   plain #D8D9DB ring on purpose: they are content, not controls, so their edge\n   is decorative and the criterion does not apply. The primary needs no ring at\n   all — its teal fill is already 4.56:1. */\n.rd-action--secondary {\n  flex: 1 1 42%;\n  flex-direction: column;\n  gap: 0;\n  background: var(--otk-bg);\n  box-shadow: inset 0 0 0 1px var(--rd-edge);\n  color: var(--otk-ink);\n}\n\n.rd-action--secondary:active { background: var(--rd-press); filter: none; }\n.rd-action__table { font: var(--rd-label-sm); font-variant-numeric: tabular-nums; }\n\n/* ── Hover ──\n   Gated behind a real pointer. On touch, :hover latches on tap and never\n   clears, so a tapped row or button stays tinted for the rest of the session —\n   which on a phone recreation reads as a broken default state, and did. */\n@media (hover: hover) and (pointer: fine) {\n  .rd-chip:hover { background: var(--rd-hover); }\n  .rd-row--action:hover { background: var(--rd-hover); }\n  .rd-iconbtn:hover { background: var(--rd-hover); }\n  .rd-select__item:not([data-active=\"true\"]):hover { background: var(--otk-surface); }\n  .rd-action:hover { filter: brightness(0.96); }\n  .rd-action--secondary:hover { background: var(--otk-surface); filter: none; }\n  /* Back-of-House chrome. Gated with everything else: on touch, hover latches\n     after a tap and leaves a rail button or a list row stuck lit — which on a\n     SELECTION control reads as a second selection. */\n  .rdp-icon--bare:hover,\n  .rdp-chip:not(.rdp-chip--date):hover,\n  .rdp-dockbtn:hover,\n  .rdp-quote:hover { background: var(--rdp-chrome-alt); }\n  .rdp-resv:not([data-selected=\"true\"]):hover { background: var(--rdp-chrome-alt); }\n  .rdp-status:hover { filter: brightness(0.96); }\n  .rdp-table:hover { background: var(--otk-surface); }\n}\n\n/* ═══════════════════════════════════════════════════════════════════\n   iPad / Back of House shell (.rdp-*)\n   ───────────────────────────────────────────────────────────────────\n   Only the CHROME the tablet adds: the service bar, the service-list\n   panel and the side panel. Every zone of the guest record itself keeps\n   its `.rd-*` classes, so the record is not restyled for tablet — it is\n   re-composed. That is the case study's claim, enforced by the\n   stylesheet rather than asserted in a caption.\n\n   The dark values are OTKit's OWN dark-mode tokens, read from the source\n   file, not sampled or invented — background/default #141A26,\n   background/elevation #2D333F, border/default #6F737B, and the accent\n   set the service lists colour-block with. An earlier pass guessed at\n   these from a clip and produced a chrome that was plausible and wrong.\n\n   Two structural corrections came with them. There is no vertical icon\n   rail in the real app — navigation is the drawer button in the service\n   bar plus this panel's own dock — so the record gets that width back.\n   And the date/shift/nav controls are OUTLINED, not filled: the fill\n   they had was 1.31:1 against the bar, doing a border's job badly.\n\n   The tablet does NOT get a squashed phone. Below ~860px the shell keeps\n   its true proportions and scrolls sideways instead of collapsing three\n   columns into slivers — a 114px-wide \"record\" column is not evidence of\n   anything.\n   ═══════════════════════════════════════════════════════════════════ */\n.rdp {\n  --rdp-chrome: #141a26;          /* background/default */\n  --rdp-chrome-alt: #2d333f;      /* background/elevation */\n  --rdp-edge: #6f737b;            /* border/default — 3.66:1 on the panel */\n  /* Selected surface. Only 2.19:1 against the panel — deliberately, because the\n     accent bar beside it is what SC 1.4.11 is satisfied by; the fill is there to\n     make the row scannable, and it keeps white at 7.94:1 and the secondary tone\n     at 5.62:1, which a lighter step would not. */\n  --rdp-selected: #4a5162;\n  --rdp-on-chrome: #ffffff;\n  --rdp-on-chrome-alt: #d8d9db;   /* ash-lighter */\n  --rdp-live: #64c987;\n  --rdp-badge: #4a6fde;\n  /* Focus on the dark panels. OTKit's action teal is 3.82:1 there — legal for a\n     non-text indicator but muddy against near-black; the legacy primary blue is\n     8:1 and is what the product actually rings with. */\n  --rdp-focus: #6cb6f5;\n  /* The list panel's square controls — the section collapse caret and the row's\n     status button — are one shape at one size. They sit in the same right-hand\n     column, so any difference between them reads as a misalignment. */\n  --rdp-btn-w: 46px;\n  --rdp-btn-h: 52px;\n  overflow-x: auto;\n  overscroll-behavior-x: contain;\n  scrollbar-width: thin;\n}\n.rdp-device {\n  width: 100%;\n  /* Sized so the shell fits the case column exactly at desktop — 854px of\n     content, 848 of shell — and only pans on narrow viewports. */\n  min-width: 1240px;\n  margin: 0 auto;\n  padding: 8px;\n  border-radius: 22px;\n  background: linear-gradient(158deg, #33373d 0%, #17191c 38%, #0d0e10 70%, #26292e 100%);\n  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.08), 0 20px 48px -14px rgba(10, 13, 10, 0.5);\n}\n.rdp-screen {\n  display: flex;\n  flex-direction: column;\n  height: 848px;\n  border-radius: 13px;\n  overflow: hidden;\n  background: var(--rdp-chrome);\n}\n\n/* ── Service bar ── */\n.rdp-statusbar {\n  flex: none;\n  display: flex;\n  align-items: center;\n  justify-content: space-between;\n  height: 26px;\n  padding: 0 16px;\n  background: var(--rdp-chrome);\n  color: var(--rdp-on-chrome);\n  font: var(--rd-label-sm);\n  font-variant-numeric: tabular-nums;\n}\n.rdp-statusbar b { font-weight: 600; }\n.rdp-battery { display: inline-flex; align-items: center; gap: 5px; }\n.rdp-batt {\n  width: 22px;\n  height: 11px;\n  border-radius: 3px;\n  background: currentColor;\n  box-shadow: 0 0 0 1px var(--rdp-chrome), 0 0 0 2px currentColor;\n}\n.rdp-topbar {\n  flex: none;\n  display: flex;\n  align-items: center;\n  gap: 10px;\n  height: 56px;\n  padding: 0 14px;\n  background: var(--rdp-chrome);\n  color: var(--rdp-on-chrome);\n  font: var(--rd-label-sm);\n}\n.rdp-icon--bare {\n  display: inline-flex;\n  align-items: center;\n  justify-content: center;\n  width: 32px;\n  height: 32px;\n  border: 0;\n  border-radius: var(--otk-radius);\n  background: none;\n  color: var(--rdp-on-chrome);\n  cursor: pointer;\n  transition: background-color var(--rd-dur) var(--rd-ease);\n}\n.rdp-icon--bare:focus-visible { outline: 2px solid var(--rdp-focus); outline-offset: 1px; }\n.rdp-covers {\n  display: inline-flex;\n  align-items: center;\n  gap: 6px;\n  margin-right: 6px;\n  font: var(--rd-label-sm);\n  font-variant-numeric: tabular-nums;\n}\n.rdp-datebar {\n  flex: 1 1 auto;\n  display: flex;\n  align-items: center;\n  justify-content: center;\n  gap: 8px;\n}\n\n/* The one control shape the bar is built from: an outlined chip. Steps, the\n   date and shift readouts, and the nav buttons are all the same box at three\n   widths — which is why they line up without any of them being special-cased. */\n.rdp-chip {\n  position: relative;\n  display: inline-flex;\n  align-items: center;\n  justify-content: center;\n  gap: 6px;\n  min-height: 36px;\n  padding: 0 14px;\n  border: 0;\n  border-radius: var(--otk-radius);\n  background: none;\n  box-shadow: inset 0 0 0 1px var(--rdp-edge);\n  color: var(--rdp-on-chrome);\n  font: var(--rd-label-sm);\n  cursor: pointer;\n  transition: background-color var(--rd-dur) var(--rd-ease);\n}\n.rdp-chip--step { width: 44px; padding: 0; }\n/* In the list panel the same chip takes the panel button size. */\n.rdp-listhead .rdp-chip--step { width: var(--rdp-btn-w); min-height: var(--rdp-btn-h); }\n.rdp-chip--date { min-width: 132px; cursor: default; }\n.rdp-chip--nav { width: 44px; min-height: 44px; padding: 0; }\n.rdp-chip--live { width: 44px; padding: 0; cursor: default; }\n.rdp-chip:focus-visible { outline: 2px solid var(--rdp-focus); outline-offset: 2px; }\n.rdp-views { display: inline-flex; gap: 16px; }\n.rdp-caret { transform: rotate(90deg); }\n\n/* Live-service mark. Green is reinforcement — the element carries its own\n   accessible name, so the colour is never the only channel. */\n.rdp-live__dot {\n  width: 13px;\n  height: 13px;\n  border-radius: var(--radius-full);\n  background: var(--rdp-live);\n}\n.rdp-badge {\n  position: absolute;\n  top: -7px;\n  right: -7px;\n  min-width: 17px;\n  height: 17px;\n  padding: 0 4px;\n  border-radius: var(--radius-full);\n  background: var(--rdp-badge);\n  color: #ffffff;\n  font: var(--rd-label-xs);\n  line-height: 17px;\n  text-align: center;\n}\n.rdp-newdot {\n  position: absolute;\n  top: 50%;\n  left: 50%;\n  /* Anchored to the 20px glyph's top-right corner, not the button's — a dot in\n     the corner of a 46px hit area reads as a stray pixel. */\n  margin: -13px 0 0 4px;\n  width: 7px;\n  height: 7px;\n  border-radius: var(--radius-full);\n  background: var(--rdp-badge);\n  box-shadow: 0 0 0 2px var(--rdp-chrome);\n}\n\n/* Selection on the dark panels, stated once.\n   A raised fill alone is 1.31:1 against the panel beside it, which means the\n   only difference between the current section — or the current reservation —\n   and its neighbours would be invisible to low vision. SC 1.4.11 covers a state\n   indicator, not just a boundary, so every selected control here carries an\n   accent bar at 4.23:1 as well as its fill. The bar is the signal; the fill is\n   there to make the row scannable. */\n.rdp-sel { position: relative; }\n.rdp-resv.rdp-sel[data-selected=\"true\"] { background: var(--rdp-selected); }\n.rdp-sel[data-selected=\"true\"]::after {\n  content: \"\";\n  position: absolute;\n  background: var(--otk-action);\n  border-radius: 0 var(--otk-radius) var(--otk-radius) 0;\n}\n\n/* ── Sections rail ── */\n.rdp-body { flex: 1 1 auto; display: flex; min-height: 0; }\n.rdp-rail {\n  flex: none;\n  display: flex;\n  flex-direction: column;\n  align-items: center;\n  gap: 4px;\n  width: 48px;\n  padding: 8px 0 10px;\n  background: var(--rdp-chrome);\n}\n.rdp-railbtn {\n  position: relative;\n  display: inline-flex;\n  align-items: center;\n  justify-content: center;\n  width: 32px;\n  height: 32px;\n  border: 0;\n  border-radius: var(--otk-radius);\n  background: none;\n  color: var(--rdp-on-chrome-alt);\n  cursor: pointer;\n  transition: background-color var(--rd-dur) var(--rd-ease), color var(--rd-dur) var(--rd-ease);\n}\n.rdp-railbtn[data-selected=\"true\"] { color: var(--rdp-focus); }\n/* Where the bar sits differs per surface: the rail marks its own left edge, the\n   list marks the row's leading edge against the panel. */\n/* The rail marks its section with an accent EDGE and a tinted glyph — no\n   raised fill, per the comp. Both are the legacy primary blue at 8:1. */\n.rdp-railbtn::after { inset: 3px auto 3px -6px; width: 3px; background: var(--rdp-focus); }\n.rdp-resv::after { inset: 0 auto -1px 0; width: 3px; }\n.rdp-rail__spacer { flex: 1 1 auto; }\n.rdp-railbtn:focus-visible { outline: 2px solid var(--rdp-focus); outline-offset: 1px; }\n\n/* ── Service lists ── */\n.rdp-sidebar {\n  flex: none;\n  display: flex;\n  flex-direction: column;\n  width: 280px;\n  min-height: 0;\n  background: var(--rdp-chrome);\n  color: var(--rdp-on-chrome);\n}\n.rdp-lists {\n  flex: 1 1 auto;\n  /* Room for one more row to clear the dock. Without it the last row is sliced\n     mid-height at max scroll, which reads as a rendering fault rather than as\n     \"there is more below\". */\n  padding-bottom: 8px;\n  overflow-y: auto;\n  overscroll-behavior: contain;\n  scrollbar-width: none;\n}\n.rdp-lists::-webkit-scrollbar { display: none; }\n.rdp-listhead {\n  display: flex;\n  align-items: center;\n  gap: 8px;\n  line-height: 1;\n  padding: 8px 8px 8px 12px;\n  border-top: 1px solid var(--rdp-chrome-alt);\n}\n.rdp-lists > section:first-child .rdp-listhead { border-top: 0; }\n.rdp-listhead__title { flex: 1 1 auto; min-width: 0; }\n.rdp-listhead b { display: block; font: var(--rd-label-md); font-weight: 700; }\n.rdp-listhead i {\n  display: block;\n  font: var(--rd-body-sm);\n  font-style: normal;\n  color: var(--rdp-on-chrome-alt);\n  text-decoration: underline;\n  text-underline-offset: 2px;\n  /* One line, always. Wrapped, it pushes the counts off the header's baseline\n     and the row stops reading as a header at all. */\n  white-space: nowrap;\n  overflow: hidden;\n  text-overflow: ellipsis;\n}\n.rdp-listhead b { white-space: nowrap; }\n.rdp-counts {\n  display: inline-flex;\n  align-items: center;\n  gap: 4px;\n  line-height: 1;\n  font: var(--rd-label-sm);\n  font-variant-numeric: tabular-nums;\n}\n.rdp-counts .rd-icon { color: var(--rdp-on-chrome-alt); }\n.rdp-quotes { display: grid; grid-template-columns: repeat(6, 1fr); gap: 5px; padding: 0 8px 10px 12px; }\n.rdp-quote {\n  display: inline-flex;\n  flex-direction: column;\n  align-items: center;\n  justify-content: center;\n  gap: 1px;\n  min-height: 44px;\n  padding: 4px 0;\n  border: 0;\n  border-radius: var(--otk-radius);\n  background: none;\n  box-shadow: inset 0 0 0 1px var(--rdp-edge);\n  color: var(--rdp-on-chrome);\n  cursor: pointer;\n  transition: background-color var(--rd-dur) var(--rd-ease);\n}\n.rdp-quote__unit { font: var(--rd-label-sm); }\n.rdp-quote__n { font: var(--rd-label-sm); font-variant-numeric: tabular-nums; }\n.rdp-quote--add { justify-content: center; }\n.rdp-quote:focus-visible { outline: 2px solid var(--rdp-focus); outline-offset: 2px; }\n\n.rdp-resv {\n  position: relative;\n  display: flex;\n  align-items: center;\n  gap: 6px;\n  width: 100%;\n  padding: 8px 8px 8px 0;\n  border: 0;\n  border-top: 1px solid var(--rdp-chrome-alt);\n  background: none;\n  color: var(--rdp-on-chrome);\n  text-align: left;\n  cursor: pointer;\n  transition: background-color var(--rd-dur) var(--rd-ease);\n}\n/* The leading marker. It bleeds to the panel edge only when it is TONED — per\n   the comp, that is reserved for attention states, so the colour column down the\n   left means \"these need you\" rather than merely \"these exist\". */\n.rdp-state {\n  flex: none;\n  display: inline-flex;\n  align-items: center;\n  justify-content: center;\n  width: 28px;\n  align-self: stretch;\n  min-height: 42px;\n  color: var(--rdp-on-chrome);\n}\n.rdp-state[data-tone] { border-radius: 0 var(--otk-radius) var(--otk-radius) 0; }\n.rdp-state[data-tone=\"fuchsia\"] { background: #d82c82; }\n.rdp-state[data-tone=\"yellow\"] { background: #fdaf08; color: #141a26; }\n.rdp-state[data-tone=\"green\"] { background: #2f864d; }\n.rdp-resv__size { flex: none; font: var(--rd-label-md); font-variant-numeric: tabular-nums; }\n.rdp-resv__body { flex: 1 1 auto; min-width: 0; }\n.rdp-resv__time {\n  display: block;\n  font: var(--rd-body-sm);\n  color: var(--rdp-on-chrome-alt);\n  font-variant-numeric: tabular-nums;\n  /* One line. Wrapped, the seated rows' \"5:30 pm · 1h 5m\" pushes the name onto\n     a third line and the row stops matching its neighbours. */\n  white-space: nowrap;\n  overflow: hidden;\n  text-overflow: ellipsis;\n}\n.rdp-resv__name {\n  display: block;\n  font: var(--rd-label-md);\n  font-weight: 600;\n  white-space: nowrap;\n  overflow: hidden;\n  text-overflow: ellipsis;\n}\n/* Attribute marks. Tone is reinforcement only — each mark repeats something the\n   record states in words, so a monochrome reading loses nothing.\n   Every mark gets the SAME square cell and is centred in it. The glyphs are all\n   24×24 artwork but they fill their box differently (a star is edge-to-edge, a\n   voicemail is wide and short), so laying them out on their intrinsic width\n   spaces them unevenly and lands them on different vertical centres. */\n.rdp-marks {\n  flex: none;\n  align-self: flex-start;\n  display: flex;\n  flex-wrap: wrap;\n  justify-content: flex-end;\n  align-content: flex-start;\n  gap: 2px;\n  /* Four cells per line. Bounded so the cluster wraps INTO the row's second\n     line, as in the comp, instead of drifting free between the name and the\n     status button wherever the count happens to leave room. */\n  max-width: 82px;\n  /* The first line of marks sits on the RESERVATION TIME's line, not at the top\n     of the row: the 18px cell is taller than the time's 16px line box, so it\n     needs the difference plus the line box's own offset to share its centre. */\n  padding-top: 6px;\n}\n.rdp-marks > span {\n  display: inline-flex;\n  align-items: center;\n  justify-content: center;\n  width: 18px;\n  height: 18px;\n}\n.rdp-marks [data-tone=\"fuchsia\"] { color: #f472b6; }\n.rdp-marks [data-tone=\"purple\"] { color: #bb6acd; }\n.rdp-marks [data-tone=\"green\"] { color: #64c987; }\n.rdp-marks [data-tone=\"yellow\"] { color: #fdaf08; }\n.rdp-marks [data-tone=\"teal\"] { color: #61bddb; }\n/* Trailing column: the table number, then the status control under it. The\n   status is the affordance — its fill and glyph come from the same 22-state\n   taxonomy the status-dropdown demo edits, so the two cannot drift. */\n/* The utility dock — the other half of navigation, with sign-out set apart. */\n.rdp-dock {\n  position: relative;\n  flex: none;\n  display: flex;\n  background: var(--rdp-chrome);\n  box-shadow: var(--rd-edge-up);\n}\n.rdp-dockbtn {\n  position: relative;\n  flex: 1 1 0;\n  display: inline-flex;\n  align-items: center;\n  justify-content: center;\n  min-height: 46px;\n  border: 0;\n  background: none;\n  color: var(--rdp-on-chrome);\n  cursor: pointer;\n  transition: background-color var(--rd-dur) var(--rd-ease);\n}\n/* Raised tiles with a hairline between, as in the comp — not a flat strip. */\n.rdp-dockbtn { background: var(--rdp-chrome-alt); }\n.rdp-dockbtn + .rdp-dockbtn { box-shadow: inset 1px 0 0 var(--rdp-chrome); }\n.rdp-dockbtn:focus-visible { outline: 2px solid var(--rdp-focus); outline-offset: -2px; }\n/* The dock has no gutter above it to hang badges in, so they sit inside. */\n.rdp-dockbtn .rdp-badge { top: 6px; right: 50%; margin-right: -18px; }\n.rdp-dockbtn .rdp-newdot { margin: -13px 0 0 4px; }\n\n/* Trailing control: one button, full row height, table number stacked over the\n   status glyph inside it. */\n.rdp-trail { flex: none; display: flex; }\n/* Two treatments, chosen by the state's service phase (see the comp):\n     pre-dining   → OUTLINED, the status carried by the glyph's colour\n     during-service → FILLED with the status colour, glyph in its `on` tone\n   The outlined form keeps the PANEL as its own surface rather than inheriting\n   the row's, because on the selected row (#4a5162) the weakest glyph\n   (accent-teal) falls to 1.48:1 — the status becomes unreadable on exactly the\n   row whose record is open. Against the panel all eleven tones clear 3:1. */\n.rdp-statebtn {\n  flex: none;\n  display: inline-flex;\n  flex-direction: column;\n  align-items: center;\n  justify-content: center;\n  gap: 1px;\n  width: var(--rdp-btn-w);\n  height: var(--rdp-btn-h);\n  padding: 3px 0;\n  border-radius: var(--otk-radius);\n  background: var(--rdp-chrome);\n  box-shadow: inset 0 0 0 1px var(--rdp-edge);\n}\n/* The number is the guest-facing fact; the glyph is the state. Both live in the\n   control, so \"table 31, running late\" is one object rather than two. */\n.rdp-statebtn__table {\n  font: var(--rd-label-sm);\n  font-variant-numeric: tabular-nums;\n  color: var(--rdp-on-chrome);\n}\n.rdp-statebtn[data-filled=\"true\"] .rdp-statebtn__table { color: inherit; }\n\n\n\n/* The record. Zones keep their .rd-* classes; only the container is new.\n   The column splits: identity zones are FIXED at the top and only the notes\n   scroll. That is the one thing the tablet can do that the phone cannot — the\n   guest you are annotating stays on screen the whole way down the guestbook. */\n.rdp-main {\n  flex: 1 1 auto;\n  min-width: 0;\n  display: flex;\n  flex-direction: column;\n  background: var(--otk-bg);\n}\n.rdp-main > .rdp-facts,\n.rdp-main > .rd-row { flex: none; }\n.rdp-notes {\n  /* Positioned for the same reason .rd-scroll is: the strip and the spy both\n     read section offsetTop, and an unpositioned scroller hands them page-level\n     coordinates and clamps every jump to max scroll. */\n  position: relative;\n  flex: 1 1 auto;\n  overflow-y: auto;\n  overscroll-behavior: contain;\n  scrollbar-width: none;\n}\n.rdp-notes::-webkit-scrollbar { display: none; }\n.rdp-notes:focus-visible { outline: 2px solid var(--otk-focus); outline-offset: -2px; }\n/* Sized to the shorter scope so History can still scroll its top up to the\n   strip — same rule as the phone, different scroller height. */\n.rdp .rd-section--history { padding-bottom: 40px; }\n.rdp-facts { display: flex; gap: 8px; padding: 10px 16px; border-bottom: 1px solid var(--rd-hairline); }\n.rdp-fact {\n  flex: none;\n  display: inline-flex;\n  align-items: center;\n  gap: 6px;\n  min-height: 44px;\n  padding: 0 12px;\n  border-radius: var(--otk-radius);\n  box-shadow: inset 0 0 0 1px var(--rd-edge);\n  font: var(--rd-label-sm);\n  font-variant-numeric: tabular-nums;\n  color: var(--otk-ink);\n}\n.rdp-fact .rd-icon { color: var(--rd-glyph); }\n\n/* Zones that sit UNDER the record on the phone sit BESIDE it here. */\n.rdp-side {\n  flex: none;\n  width: 284px;\n  display: flex;\n  flex-direction: column;\n  min-height: 0;\n  overflow-y: auto;\n  scrollbar-width: none;\n  border-left: 1px solid var(--rd-hairline);\n  background: var(--otk-bg);\n}\n.rdp-side::-webkit-scrollbar { display: none; }\n.rdp-side .rd-row { background: transparent; }\n.rdp-actions { display: flex; flex-direction: column; }\n/* Reservation status — the panel's one filled control, and the only one, so\n   \"what state is this booking in\" is answerable before anything else is read. */\n.rdp-status {\n  flex: none;\n  display: flex;\n  align-items: center;\n  gap: 10px;\n  min-height: 44px;\n  padding: 0 12px;\n  border: 0;\n  background: var(--otk-action);\n  color: var(--otk-bg);\n  cursor: pointer;\n  transition: filter var(--rd-dur) var(--rd-ease);\n}\n.rdp-status__label { flex: 1 1 auto; font: var(--rd-label-md); text-align: left; }\n.rdp-status__chev { transform: rotate(90deg); }\n.rdp-status:focus-visible { outline: none; box-shadow: inset 0 0 0 3px var(--otk-bg); }\n\n/* Action rows. One shape, a leading glyph and an optional second line — the\n   second line is not decoration: \"Send\" and \"Re-send\" are indistinguishable\n   without naming what each would actually send. */\n.rdp-act {\n  display: flex;\n  align-items: center;\n  gap: 10px;\n  width: 100%;\n  min-height: 46px;\n  padding: 8px 12px;\n  border: 0;\n  border-bottom: 1px solid var(--rd-hairline);\n  background: var(--otk-bg);\n  color: var(--otk-ink);\n  text-align: left;\n  cursor: pointer;\n  transition: background-color var(--rd-dur-emph) var(--rd-ease);\n}\n.rdp-act:active { background: var(--rd-press); transition-duration: 40ms; }\n.rdp-act:focus-visible { outline: none; box-shadow: inset 0 0 0 2px var(--otk-focus); }\n.rdp-act > .rd-icon:first-child { color: var(--rd-glyph); }\n.rdp-act__body { flex: 1 1 auto; min-width: 0; }\n.rdp-act__body b { display: block; font: var(--rd-label-md); }\n.rdp-act__body i { display: block; font: var(--rd-body-sm); font-style: normal; color: var(--rd-muted); }\n.rdp-act__chev { color: var(--rd-glyph); transform: rotate(90deg); }\n/* The balance is a readout, so the tone repeats what the label already says. */\n.rdp-act--danger { color: #931b23; }\n.rdp-act--danger > .rd-icon:first-child { color: #931b23; }\n.rdp-act--order { border-bottom: 0; }\n.rdp-order { border-bottom: 1px solid var(--rd-hairline); }\n.rr-demo.rd .rdp-order__items {\n  margin: 0;\n  padding: 0 12px 10px 42px;\n  list-style: none;\n}\n.rr-demo.rd .rdp-order__items li {\n  margin: 0;\n  padding: 0;\n  font: var(--rd-body-sm);\n  color: var(--rd-muted);\n}\n.rr-demo.rd .rdp-order__items li + li { margin-top: 3px; }\n.rdp-table {\n  display: flex;\n  align-items: center;\n  gap: 8px;\n  padding: 9px 10px;\n  border: 0;\n  border-radius: var(--otk-radius);\n  background: var(--otk-bg);\n  box-shadow: inset 0 0 0 1px var(--rd-edge);\n  color: var(--otk-ink);\n  text-align: left;\n  cursor: pointer;\n}\n.rdp-table .rd-icon { color: var(--rd-glyph); }\n.rdp-table__body b { display: block; font: var(--rd-label-sm); }\n.rdp-table__body i { display: block; font: var(--rd-body-sm); font-style: normal; color: var(--rd-muted); }\n.rdp-table:focus-visible { outline: none; box-shadow: inset 0 0 0 1px var(--rd-edge), 0 0 0 2px var(--otk-focus); }\n/* These two are lifted straight from the phone, so they arrive with its row\n   padding, borders and 24px glyphs — none of which belongs in a 196px panel.\n   The zone is reused; its scale is the panel's business. */\n/* The panel reads top-down as state → settings, so the settings sit AT the\n   bottom rather than stacking under the state and leaving a void below. */\n.rdp-side__settings { margin-top: auto; }\n.rdp-sideRow { padding: 8px 6px; border: 0; gap: 8px; }\n/* The phone's switch is a 51x31 thumb-sized control. In a 180px properties\n   panel that is the loudest thing on screen for the least important setting. */\n.rdp .rd-switch__track { width: 42px; height: 26px; }\n.rdp .rd-switch__thumb { width: 22px; height: 22px; }\n.rdp .rd-switch input:checked ~ .rd-switch__track .rd-switch__thumb { transform: translateX(16px); }\n.rdp-sideRow .rd-icon { width: 16px; height: 16px; }\n.rdp .rd-referral { font: var(--rd-body-sm); font-weight: 600; }\n.rdp .rd-row--switch { border-top: 0; }\n.rdp .rd-switch__label { font: var(--rd-body-sm); }\n\n/* ── Phone: teaser, then full-screen ──\n   The columns never collapse — the composition IS the artefact and a collapsed\n   one shows nothing. So below 700px the shell rests scaled and inert behind a\n   tap target, and opens to a full-screen stage where it pans at its true size. */\n.rdp-tap, .rdp-close { display: none; }\n@media (max-width: 700px) {\n  /* .rr-demo carries a 470px min-height at this width — a layout-stability guard\n     for the other demos, which would otherwise leave 240px of dead scrim under\n     the teaser and put the CTA nowhere near the thing it opens. */\n  .rdp { overflow: hidden; min-height: 0; }\n  .rdp-tap {\n    position: absolute;\n    inset: 0;\n    z-index: 2;\n    display: block;\n    width: 100%;\n    border: 0;\n    border-radius: var(--radius-sm);\n    background: linear-gradient(to bottom, rgba(10, 13, 10, 0.1) 40%, rgba(10, 13, 10, 0.66));\n    cursor: pointer;\n  }\n  .rdp-tap__cta {\n    position: absolute;\n    left: 50%;\n    bottom: 14px;\n    transform: translateX(-50%);\n    display: inline-flex;\n    align-items: center;\n    gap: 7px;\n    white-space: nowrap;\n    padding: 9px 16px;\n    border-radius: var(--radius-pill);\n    background: var(--color-background-action);\n    color: var(--color-foreground-on-action);\n    font: var(--font-label-medium);\n  }\n  .rdp-tap__dot {\n    width: 8px;\n    height: 8px;\n    border-radius: var(--radius-full);\n    background: var(--color-foreground-on-action);\n  }\n  .rdp-stage {\n    position: relative;\n    /* Both the factor and this height come from the measured shell width (see\n       useLayoutEffect in ReservationDetailIPad) — the whole composition shows at\n       every phone width, with no dead band under it and nothing cropped. */\n    height: var(--rdp-fit-h, 232px);\n    overflow: hidden;\n    border-radius: var(--radius-sm);\n  }\n  .rdp-stage .rdp-device {\n    transform: scale(var(--rdp-fit, 0.38));\n    transform-origin: top left;\n    pointer-events: none;\n  }\n  .rdp { position: relative; }\n\n  /* Opened — a lightbox, not a void. The shell keeps its true 848px width and\n     pans horizontally, which is what you do with a tablet screenshot anyway;\n     what it must NOT do is float in a black field with no edge and no hint that\n     there is more to the right of it. */\n  .rdp[data-expanded=\"true\"] { overflow: visible; }\n  .rdp[data-expanded=\"true\"] .rdp-tap { display: none; }\n  .rdp[data-expanded=\"true\"] .rdp-stage {\n    position: fixed;\n    inset: 0;\n    z-index: 60;\n    height: auto;\n    display: flex;\n    align-items: center;\n    padding: 0;\n    overflow-x: auto;\n    overscroll-behavior: contain;\n    /* Opaque. At 94% the page bled through top and bottom and the stage read\n       as a rendering fault rather than as a layer over the page. */\n    background: #060806;\n    border-radius: 0;\n    /* Edge fades, painted on the viewport rather than the scrolling content, so\n       they mark \"there is more this way\" at both ends. */\n    box-shadow:\n      inset 26px 0 22px -22px #060806,\n      inset -26px 0 22px -22px #060806;\n  }\n  .rdp[data-expanded=\"true\"] .rdp-device {\n    transform: none;\n    pointer-events: auto;\n    box-shadow:\n      inset 0 0 0 1px rgba(255, 255, 255, 0.08),\n      0 24px 60px -18px rgba(0, 0, 0, 0.85);\n  }\n  .rdp[data-expanded=\"true\"] .rdp-close {\n    position: fixed;\n    top: max(10px, env(safe-area-inset-top));\n    right: 10px;\n    z-index: 61;\n    display: inline-flex;\n    align-items: center;\n    justify-content: center;\n    width: 40px;\n    height: 40px;\n    border: 1px solid var(--color-border-def
